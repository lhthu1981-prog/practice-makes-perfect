function parseExamText(text) {
  const meta = {}, sections = [], errors = [];
  let part = '', sec = null, mode = null, buf = [];
  const newSec = title => { sec = { part: part || 'Đề thi', title: title || '', instruction: '', passage: '', audioUrl: '', script: [], questions: [], _q: [] }; sections.push(sec); };
  const flush = () => {
    if (!sec || !mode) { buf = []; return; }
    const txt = buf.join('\n').replace(/^\n+|\n+$/g, '');
    if (mode === 'ins') sec.instruction = txt.trim();
    else if (mode === 'pas') sec.passage = txt;
    else if (mode === 'aud') buf.forEach(raw => {
      const l = raw.trim(); if (!l) return; let m;
      if ((m = l.match(/^(link|audio)\s*:\s*(https?:\/\/\S+)/i))) { sec.audioUrl = m[2]; return; }
      if ((m = l.match(/^([^:]{1,28}):\s+(.+)$/)) && !/^https?$/i.test(m[1])) sec.script.push([m[1].trim(), m[2].trim()]);
      else if (sec.script.length) sec.script[sec.script.length - 1][1] += ' ' + l; else sec.script.push(['', l]);
    });
    else if (mode === 'q') sec._q.push(txt);
    buf = [];
  };
  String(text || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.trim(); let m;
    if (/^#\s+/.test(l) && !/^##/.test(l)) { flush(); mode = null; meta.title = l.replace(/^#\s+/, '').trim(); return; }
    if (/^##\s+/.test(l) && !/^###/.test(l)) { flush(); mode = null; part = l.replace(/^##\s+/, '').trim(); sec = null; return; }
    if (/^###\s+/.test(l)) { flush(); mode = null; newSec(l.replace(/^###\s+/, '').trim()); return; }
    if ((m = l.match(/^\[(.+)\]$/))) {
      const k = m[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
      const mm = /huong dan/.test(k) ? 'ins' : /nghe|listen|audio/.test(k) ? 'aud' : /bai doc|doc|passage|text/.test(k) ? 'pas' : /cau hoi|question/.test(k) ? 'q' : null;
      if (mm) { flush(); if (!sec) newSec(''); mode = mm; return; }
    }
    if (!mode && !sections.length && (m = l.match(/^(khối|khoi|loại|loai|thời gian|thoi gian|xem đáp án|xem dap an)\s*:\s*(.+)$/i))) {
      const k = m[1].toLowerCase(), v = m[2].trim();
      if (/kh/.test(k)) meta.grade = (v.match(/\d+/) || [''])[0];
      else if (/lo/.test(k)) { const t = Object.keys(EXAM.types).find(x => x.toLowerCase() === v.toLowerCase() || EXAM.types[x].toLowerCase() === v.toLowerCase()); if (t) meta.examType = t; else errors.push('Loại đề không rõ: ' + v); }
      else if (/th/.test(k)) meta.duration = parseInt(v, 10) || 60;
      else meta.answerMode = /gi[aá]o vi[eê]n|gv|teacher/i.test(v) ? 'teacher' : 'instant';
      return;
    }
    if (mode) buf.push(raw.replace(/\s+$/, ''));
  });
  flush();
  let n = 0;
  sections.forEach(s => {
    s._q.join('\n\n').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach(block => {
      n++;
      const q = { type: 'mcq', q: '', options: {}, answer: '', explanation: '' }, ql = [];
      block.split('\n').map(x => x.trim()).filter(Boolean).forEach(l => {
        let m;
        if ((m = l.match(/^([A-E])\s*[.)]\s*(.*)$/))) q.options[m[1].toUpperCase()] = m[2];
        else if ((m = l.match(/^(đáp án|dap an|answer|key)\s*[:：]\s*(.*)$/i))) q.answer = m[2].trim();
        else if ((m = l.match(/^(giải thích|giai thich|explanation)\s*[:：]\s*(.*)$/i))) q.explanation = m[2].trim();
        else ql.push(l);
      });
      q.q = ql.join('\n').replace(/^(câu|question)?\s*\d+\s*[.):]\s*/i, '').replace(/^(câu|question)\s*\d+\s*$/i, '');
      if (!Object.keys(q.options).length) { q.type = 'fill'; delete q.options; if (!q.answer) errors.push(`Câu ${n}: thiếu “Đáp án:”`); }
      else { q.answer = (q.answer.match(/^[A-E]/i) || [''])[0].toUpperCase(); if (!q.options[q.answer]) errors.push(`Câu ${n}: thiếu đáp án đúng (A–${Object.keys(q.options).pop()})`); }
      s.questions.push(q);
    });
    delete s._q;
    if (!s.questions.length) errors.push(`Phần “${s.part}${s.title ? ' – ' + s.title : ''}” chưa có câu hỏi nào.`);
  });
  return { meta, sections, errors, count: n };
}

function examToText(m, sections) {
  const out = [`# ${m.title}`, `Khối: ${m.grade}`, `Loại: ${m.examType}`, `Thời gian: ${m.duration}`, `Xem đáp án: ${m.answerMode === 'teacher' ? 'giáo viên mở' : 'ngay'}`];
  let part = null, n = 0;
  sections.forEach(s => {
    if (s.part !== part) { out.push('', `## ${s.part}`); part = s.part; }
    out.push(`### ${s.title || 'Section'}`);
    if (s.instruction) out.push('[HƯỚNG DẪN]', s.instruction);
    if (s.audioUrl || (s.script || []).length) { out.push('[NGHE]'); if (s.audioUrl) out.push('Link: ' + s.audioUrl); (s.script || []).forEach(([w, t]) => out.push(w ? `${w}: ${t}` : t)); }
    if (s.passage) out.push('[BÀI ĐỌC]', s.passage);
    out.push('[CÂU HỎI]');
    (s.questions || []).forEach(q => {
      n++;
      out.push(`${n}. ${q.q || ''}`.trim());
      if (q.options) Object.keys(q.options).forEach(k => out.push(`${k}. ${q.options[k]}`));
      out.push(`Đáp án: ${q.answer}`);
      if (q.explanation) out.push(`Giải thích: ${q.explanation}`);
      out.push('');
    });
  });
  return out.join('\n');
}

      <textarea class="inp mono" rows="20" data-xe="text" style="margin-top:10px">${esc(x.text)}</textarea>
    </div>
    <div class="card" style="margin-top:16px"><h3>Xem trước</h3><div id="xePrev" style="margin-top:8px"></div></div>
    <div class="sticky-save"><button class="btn" data-act="admin" data-tab="exams">Huỷ</button><button class="btn primary" id="xeSave" data-act="xeSave">💾 Lưu đề</button></div>
  </div>`;
  $('#xeFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { S.xEdit.text = r.result; applyExamMeta(); renderExamEditor(); }; r.readAsText(f, 'utf-8');
  });
  renderExamPreview();
}
function applyExamMeta() {
  const p = parseExamText(S.xEdit.text);
  ['title', 'grade', 'examType', 'duration', 'answerMode'].forEach(k => { if (p.meta[k] != null && p.meta[k] !== '') S.xEdit[k] = p.meta[k]; });
}
function renderExamPreview() {
  const p = parseExamText(S.xEdit.text);
  S.xEdit.parsed = p;
  let lastPart = '';
  $('#xePrev').innerHTML = p.sections.length ? `<table class="lb"><thead><tr><th>Phần</th><th>Section</th><th>Nghe</th><th>Bài đọc</th><th>Số câu</th></tr></thead><tbody>
    ${p.sections.map(s => { const r = `<tr><td>${s.part !== lastPart ? `<b>${esc(s.part)}</b>` : ''}</td><td>${esc(s.title || '—')}</td>
      <td>${s.audioUrl ? '🔗 file' : s.script.length ? `🗣 ${s.script.length} lượt lời` : '—'}</td><td>${s.passage ? s.passage.split(/\s+/).length + ' từ' : '—'}</td><td>${s.questions.length}</td></tr>`; lastPart = s.part; return r; }).join('')}
    </tbody></table><p style="margin:10px 0 0"><b>Tổng: ${p.count} câu</b></p>
    ${p.errors.length ? `<div class="msg err">⚠️ ${p.errors.map(esc).join('<br>⚠️ ')}</div>` : '<div class="msg ok">✓ Đề hợp lệ, có thể lưu.</div>'}`
    : '<div class="muted">Chưa đọc được phần nào. Hãy dán nội dung đề (hoặc bấm “Xem mẫu”).</div>';
  const b = $('#xeSave'); if (b) b.disabled = !p.count || p.errors.length > 0;
}
function onExamEditField(el, type) {
  const k = el.dataset.xe;
  S.xEdit[k] = el.value;
  if (k === 'text') {
    clearTimeout(onExamEditField._t);
    onExamEditField._t = setTimeout(() => {
      const before = JSON.stringify([S.xEdit.title, S.xEdit.grade, S.xEdit.examType, S.xEdit.duration, S.xEdit.answerMode]);
      applyExamMeta();
      if (JSON.stringify([S.xEdit.title, S.xEdit.grade, S.xEdit.examType, S.xEdit.duration, S.xEdit.answerMode]) !== before) {
        const ta = document.querySelector('[data-xe="text"]'), pos = ta ? ta.selectionStart : 0, top = ta ? ta.scrollTop : 0;
        renderExamEditor();
        const t2 = document.querySelector('[data-xe="text"]'); if (t2) { t2.focus(); t2.setSelectionRange(pos, pos); t2.scrollTop = top; }
      } else renderExamPreview();
    }, 300);
  }
}
async function saveExamEdit() {
  const x = S.xEdit, p = parseExamText(x.text);
  if (p.errors.length) return toast('Đề còn lỗi, xem phần “Xem trước”.', 'err');
  await run(async () => {
    const r = await call('examSave', { exam: { id: x.id, title: x.title, grade: x.grade, examType: x.examType, duration: x.duration, answerMode: x.answerMode, status: x.status }, sections: p.sections });
    toast(`Đã lưu đề (${r.questions} câu) ✓`, 'ok');
    S.xEdit = null; S.adm.exams = null;
    showAdmin('exams');
  });
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
/** Bản đặt trên GitHub Pages: lấy cấu hình mới nhất từ máy chủ (tên app, cấp độ, kỹ năng, loại đề) */
const NEED_SERVER = 5; let SERVER_OLD = false;
async function loadConfig() {
  if (typeof API_URL === 'undefined') return;
  try {
    const c = await call('config');
    APP_NAME = c.appName; SCHOOL_NAME = c.schoolName;
    LEVELS.splice(0, LEVELS.length, ...c.levels);
    SKILLS.splice(0, SKILLS.length, ...c.skills);
    EXAM.grades = c.exam.grades; EXAM.types = c.exam.types;
    SERVER_OLD = (c.version || 0) < NEED_SERVER;
    document.title = APP_NAME;
  } catch (e) {
    // Không gọi được cổng API (Apps Script chưa cập nhật doPost, hoặc lỗi tạm thời): chuyển sang giao diện chạy trực tiếp trên Apps Script
    { app.innerHTML = '<div class="page"><div class="card empty">Đang chuyển tới trang học…</div></div>'; location.replace(API_URL); await new Promise(() => {}); }
  }
}

(async function boot() {
  await loadConfig();
  if (!S.token) return showAuth();
  app.innerHTML = skeleton(6);
  try { S.user = await call('me'); goHome(); }
  catch (e) { showAuth(); }
})();
</script>
