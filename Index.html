function dueTag(iso, done) {
  if (!iso) return '<span class="tag">Không hạn</span>';
  const ms = new Date(iso).getTime() - Date.now();
  if (done) return `<span class="tag">Hạn ${fmtDate(iso)}</span>`;
  if (ms < 0) return `<span class="tag bad">Quá hạn · ${fmtDate(iso)}</span>`;
  const days = Math.floor(ms / 864e5), hours = Math.floor(ms / 36e5);
  const left = days >= 1 ? `còn ${days} ngày` : `còn ${Math.max(hours, 0)} giờ`;
  return `<span class="tag ${days < 1 ? 'warn' : ''}">Hạn ${fmtDate(iso)} · ${left}</span>`;
}
function asgIcon(a) { return a.kind === 'exercise' ? '📝' : (a.game && GAMES[a.game] ? GAMES[a.game].icon : '🎮'); }
function asgWhat(a) { return a.kind === 'exercise' ? 'Bài tập' : (a.game && GAMES[a.game] ? 'Trò chơi: ' + GAMES[a.game].name : 'Bộ từ: chơi trò bất kỳ'); }

   ===================================================================== */
function parseMulti(text, defLevel, defSub) {
  const sets = []; let cur = null, mode = null;
  String(text || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.trim(); let m;
    if ((m = l.match(/^#{2,3}\s+(.+)$/))) { cur = { title: m[1].replace(/\*/g, '').trim(), level: defLevel, subLevel: defSub, words: [], sentences: [], bad: [] }; sets.push(cur); mode = null; return; }
    if (!cur || !l || l.startsWith('```') || /^-{3,}$/.test(l)) return;
    if (!l.includes('|')) {
      if ((m = l.match(/^\**\s*(cấp độ|level)\s*:\s*\**\s*(.+?)\s*\**$/i))) {
        const v = m[2].trim().toLowerCase(), lv = LEVELS.find(x => x.id.toLowerCase() === v || x.name.toLowerCase() === v);
        if (lv) cur.level = lv.id; else cur.bad.push('Cấp độ không rõ: ' + m[2]);
        return;
      }
      if ((m = l.match(/^\**\s*(lớp|cấp nhỏ)\s*:\s*\**\s*(.+?)\s*\**$/i))) { cur.subLevel = m[2].trim(); return; }
      if (/^\**\s*(từ vựng|vocabulary|words?)\b/i.test(l)) { mode = 'w'; return; }
      if (/^\**\s*(câu|sentences?)(\s|\*|:|$)/i.test(l)) { mode = 's'; return; }
    }
    if (mode === 'w') {
      const p = l.split(/\s*\|\s*|\t/).map(x => x.trim());
      if (p[0] && p[1]) cur.words.push({ word: p[0], meaning: p[1], example: p.slice(2).join(' ').trim() }); else cur.bad.push('Dòng từ vựng lỗi: ' + l);
    } else if (mode === 's') {
      const p = l.split(/\s*\|\s*|\t/), t = (p[0] || '').trim().replace(/\s+/g, ' ');
      if (t.split(' ').length >= 2) cur.sentences.push({ text: t, meaning: (p[1] || '').trim() }); else cur.bad.push('Câu lỗi: ' + l);
    }
  });
  sets.forEach(s => {
    const lv = LEVELS.find(x => x.id === s.level);
    if (!lv || lv.subs.indexOf(s.subLevel) < 0) s.bad.push(`Lớp/cấp nhỏ “${s.subLevel || '?'}” không thuộc ${lv ? lv.name : 'cấp độ'}`);
    if (!s.words.length && !s.sentences.length) s.bad.push('Không có từ vựng hay câu nào');
  });
  return sets;
}

async function showImport() {
  renderTopbar('admin');
  window.scrollTo(0, 0);
  if (!S.adm.sets) await run(async () => { S.adm.sets = await call('listWordSets'); });
  const lv = LEVELS.find(l => l.id === 'THPT') || LEVELS[0];
  S.imp = S.imp || { level: lv.id, sub: lv.subs[0], text: '' };
  renderImport();
}

function renderImport() {
  const x = S.imp, lv = LEVELS.find(l => l.id === x.level) || LEVELS[0];
  app.innerHTML = `<div class="page" style="max-width:1000px">
    <button class="back" data-act="admin" data-tab="games">← Trò chơi</button>
    <h1>📥 Nhập nhiều bộ từ</h1>
    <div class="card" style="margin-top:16px">
      <p style="margin-top:0">Dán nội dung (hoặc chọn file .md / .txt) theo mẫu: mỗi bộ bắt đầu bằng dòng <b>## Tên bộ</b>, tiếp theo là dòng <b>Từ vựng</b> rồi các dòng <code>từ | nghĩa | ví dụ</code>, sau đó dòng <b>Câu</b> rồi các dòng <code>câu | gợi ý nghĩa</code>.
        Bộ nào không ghi “Cấp độ:” và “Lớp:” sẽ dùng giá trị mặc định bên dưới. Bộ trùng tên (cùng cấp độ và lớp) sẽ được <b>cập nhật</b>.</p>
      <div class="row">
        <div><label class="f">Cấp độ mặc định</label><select class="inp" data-imp="level">${LEVELS.map(l => `<option value="${esc(l.id)}" ${l.id === x.level ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div>
        <div><label class="f">Lớp / cấp nhỏ mặc định</label><select class="inp" data-imp="sub">${lv.subs.map(s => `<option ${s === x.sub ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
        <div><label class="f">Hoặc chọn file</label><input class="inp" type="file" accept=".md,.txt,text/plain,text/markdown" id="impFile"></div>
      </div>
      <label class="f">Nội dung</label>
      <textarea class="inp mono" rows="14" data-imp="text" placeholder="## Unit 1 – Family Life&#10;Từ vựng&#10;household chores | việc nhà | Everyone shares the household chores.&#10;Câu&#10;My mother cooks dinner every evening. | Mẹ tôi nấu bữa tối mỗi tối.">${esc(x.text)}</textarea>
    </div>
    <div class="card" style="margin-top:16px"><h3>Xem trước</h3><div id="impPreview" style="margin-top:8px"></div></div>
    <div class="sticky-save"><button class="btn" data-act="admin" data-tab="games">Huỷ</button><button class="btn primary" id="impGo" data-act="impDo">Nhập</button></div>
  </div>`;
  $('#impFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { S.imp.text = r.result; renderImport(); };
    r.readAsText(f, 'utf-8');
  });
  renderImportPreview();
}

function renderImportPreview() {
  const sets = parseMulti(S.imp.text, S.imp.level, S.imp.sub);
  S.imp.sets = sets;
  const key = s => [s.title.trim().toLowerCase(), s.level, s.subLevel].join('|');
  const existing = new Set((S.adm.sets || []).map(key));
  const bad = sets.filter(s => s.bad.length).length;
  $('#impPreview').innerHTML = sets.length ? `<table class="lb"><thead><tr><th>Bộ từ</th><th>Cấp độ</th><th>Từ</th><th>Câu</th><th>Tình trạng</th></tr></thead><tbody>
    ${sets.map(s => `<tr><td><b>${esc(s.title)}</b>${s.bad.length ? `<div class="small" style="color:var(--bad)">⚠️ ${s.bad.map(esc).join('<br>⚠️ ')}</div>` : ''}</td>
      <td>${esc(levelName(s.level))} · ${esc(s.subLevel)}</td><td>${s.words.length}</td><td>${s.sentences.length}</td>
      <td>${s.bad.length ? '<span class="tag bad">Lỗi</span>' : existing.has(key(s)) ? '<span class="tag warn">Cập nhật</span>' : '<span class="tag ok">Mới</span>'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="muted">Chưa đọc được bộ từ nào. Mỗi bộ cần bắt đầu bằng dòng “## Tên bộ”.</div>';
  const go = $('#impGo');
  go.disabled = !sets.length || bad > 0;
  go.textContent = bad ? `Còn ${bad} bộ bị lỗi` : `📥 Nhập ${sets.length} bộ`;
}

function onImpField(el, type) {
  const k = el.dataset.imp;
  S.imp[k] = el.value;
  if (k === 'level' && type === 'change') { S.imp.sub = (LEVELS.find(l => l.id === el.value) || LEVELS[0]).subs[0]; renderImport(); return; }
  if (k === 'text') { clearTimeout(onImpField._t); onImpField._t = setTimeout(renderImportPreview, 250); }
  else renderImportPreview();
}

async function doImport() {
  const sets = (S.imp.sets || []).filter(s => !s.bad.length);
  if (!sets.length) return;
  await run(async () => {
    const r = await call('importWordSets', { sets: sets.map(s => ({ title: s.title, level: s.level, subLevel: s.subLevel, status: 'open', words: s.words, sentences: s.sentences })) });
    toast(`Đã nhập: ${r.created} bộ mới, ${r.updated} bộ cập nhật ✓`, 'ok');
    S.imp = null; S.adm.sets = null;
    showAdmin('games');
  });
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
(async function boot() {
  if (!S.token) return showAuth();
  app.innerHTML = skeleton(6);
  try { S.user = await call('me'); goHome(); }
  catch (e) { showAuth(); }
})();
</script>
