<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ================= MÀU SẮC & KIỂU CHỮ ================= */
    :root{
      --violet:#7c3aed; --violet-d:#6d28d9; --pink:#db2777; --ink:#1f1235; --muted:#6b6280;
      --line:#ece6f7; --card:#fff; --ok:#059669; --ok-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2;
      --warn:#c2410c; --warn-bg:#ffedd5; --grad:linear-gradient(100deg,#6d28d9 0%,#9333ea 45%,#db2777 100%);
      --radius:18px; --shadow:0 6px 24px rgba(91,33,182,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
      background:linear-gradient(160deg,#f3edff 0%,#fbf7ff 45%,#fdf0f7 100%);min-height:100vh;font-size:15px;line-height:1.5}
    button,input,select,textarea{font:inherit;color:inherit}
    h1,h2,h3{margin:0;line-height:1.25}
    h1{font-size:28px;font-weight:800}
    h2{font-size:20px;font-weight:700}
    h3{font-size:16px;font-weight:700}
    a{color:var(--violet-d)}
    .muted{color:var(--muted)} .small{font-size:13px}
    [hidden]{display:none!important}

    /* ================= THANH TRÊN CÙNG ================= */
    .topbar{position:sticky;top:0;z-index:20;background:var(--grad);color:#fff;display:flex;align-items:center;
      justify-content:space-between;gap:12px;padding:10px clamp(12px,3vw,32px);box-shadow:0 4px 20px rgba(109,40,217,.25)}
    .brand{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700;font-size:19px;min-width:0}
    .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .logo{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);
      display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
    .nav{display:flex;align-items:center;gap:6px}
    .nav-btn{border:0;background:transparent;color:#fff;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;
      display:flex;align-items:center;gap:6px;white-space:nowrap}
    .nav-btn:hover{background:rgba(255,255,255,.15)}
    .nav-btn.on{background:#fff;color:var(--violet-d)}
    .avatar{width:42px;height:42px;border-radius:50%;background:#fde047;color:#713f12;border:0;font-weight:800;cursor:pointer;flex:none;font-size:17px}
    #busy{position:fixed;top:0;left:0;height:3px;width:0;background:#fde047;z-index:50;transition:width .3s}
    body.busy #busy{width:80%;transition:width 8s cubic-bezier(.1,.7,.2,1)}

    /* ================= KHUNG TRANG ================= */
    .page{max-width:1240px;margin:0 auto;padding:24px clamp(12px,3vw,32px) 120px}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid #f1ecfa}
    .btn{border:1px solid var(--line);background:#fff;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600;
      display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .05s}
    .btn:active{transform:scale(.98)}
    .btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 18px rgba(147,51,234,.3)}
    .btn.ghost{background:transparent}
    .btn.danger{color:var(--bad);border-color:#fecaca}
    .btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    .pill{border:1px solid var(--line);background:#fff;padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;
      display:inline-flex;align-items:center;gap:8px}
    .pill.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(147,51,234,.3)}
    .pill .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:20px}
    .pill.on .badge{background:#fff;color:var(--bad)}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .chip{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
    .chip.on{background:#ede9fe;border-color:#c4b5fd;color:var(--violet-d);font-weight:600}
    .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#f3f0fa;color:var(--muted)}
    .tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
    .empty{text-align:center;padding:40px 20px;color:var(--muted)}
    .inp,select.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;outline:none}
    .inp:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #ede9fe}
    textarea.inp{resize:vertical;min-height:80px}
    label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
    .row{display:flex;gap:12px;flex-wrap:wrap} .row>*{flex:1;min-width:160px}
    .tablewrap{overflow-x:auto}
    .tablewrap table{min-width:680px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:12px 10px;border-bottom:1px solid #f4f0fb;vertical-align:middle}
    tr:last-child td{border-bottom:0}
    .actions{display:flex;gap:6px;flex-wrap:wrap}

    /* ================= ĐĂNG NHẬP ================= */
    .auth{min-height:100vh;position:relative;display:flex;justify-content:center;align-items:flex-start;
      padding:calc(100vw * 574 / 1600 * .58) 16px 40px;background:linear-gradient(180deg,#3b1a7a 0%,#5b21b6 55%,#9d174d 100%)}
    .auth-banner{position:absolute;top:0;left:0;right:0;aspect-ratio:1600/574;
      background:var(--banner-img,var(--grad)) center top/100% auto no-repeat}
    .auth-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(59,26,122,0) 50%,rgba(59,26,122,.75) 80%,#3b1a7a 100%)}
    .auth-card{position:relative}
    @media (max-width:700px){.auth{padding-top:calc(100vw * 574 / 1600 + 8px)}}
    .auth-card{width:100%;max-width:440px;position:relative}
    .auth-hero{text-align:center;margin-bottom:22px;color:#fff;text-shadow:0 2px 12px rgba(20,8,50,.6)}
    .auth-hero h1{font-size:34px;letter-spacing:.3px}
    .auth-hero .school{font-weight:600;font-size:16px;opacity:.95;margin-top:4px;letter-spacing:1.5px;text-transform:uppercase}
    .auth-hero .logo{width:64px;height:64px;margin:0 auto 12px;background:var(--grad);color:#fff;font-size:26px;border:0}
    .seg{display:flex;background:#f3effb;border-radius:12px;padding:4px;margin-bottom:8px}
    .seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
    .seg button.on{background:#fff;color:var(--violet-d);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .msg{padding:10px 14px;border-radius:12px;margin-top:12px;font-size:14px}
    .msg.err{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)}

    /* ================= LUYỆN TẬP ================= */
    .hello{background-image:linear-gradient(90deg,rgba(76,29,149,.95) 0%,rgba(124,58,237,.8) 40%,rgba(219,39,119,.25) 100%),var(--banner-img,var(--grad));
      background-size:cover;background-position:center 30%;min-height:180px;color:#fff;border:0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    .hello .stat{background:rgba(30,10,70,.45);backdrop-filter:blur(6px);padding:10px 16px;border-radius:14px;text-align:center}
    .hello .stat b{display:block;font-size:22px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .ex-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s, box-shadow .15s}
    .ex-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(91,33,182,.14)}
    .ex-card h3{font-size:16px}
    .ex-card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .ex-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
    .skill{padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700}

    /* ================= LÀM BÀI ================= */
    .back{border:0;background:none;color:var(--violet-d);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
    .crumbs{color:var(--muted);font-size:14px;margin-bottom:4px}
    .ex-layout{display:grid;gap:18px;margin-top:18px}
    .ex-layout.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .ex-side{display:flex;flex-direction:column;gap:16px}
    .ex-layout.two .ex-side{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 170px);overflow:auto}
    .cz-ed{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:14px}
    .cz-prev{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
    .cz-hint{background:#ede9fe;color:#5b21b6;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13.5px}
    .cz-foot{display:flex;align-items:center;gap:10px;margin:16px 0 30px;flex-wrap:wrap}
    .cz-switch{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
    .mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
    .cz-err{background:#fef2f2;color:#b91c1c;border-radius:10px;padding:7px 10px;margin:6px 0;font-size:13.5px}
    .cz-warn{background:#fffbeb;color:#92400e;border-radius:10px;padding:7px 10px;margin:6px 0;font-size:13.5px}
    .cz-ins{background:#f5f3ff;border-left:4px solid #7c3aed;border-radius:10px;padding:10px 14px;margin:12px 0;font-style:italic}
    .cz-text{line-height:2.15;font-size:15.5px}
    .cz-title{text-align:center;margin:4px 0 10px;font-size:17px}
    .cz-p{margin:0 0 10px;text-indent:24px}
    .cz-center{text-align:center;font-weight:600;margin:-4px 0 10px}
    .cz-ul{margin:0 0 10px;padding-left:22px}.cz-ul li{margin-bottom:4px}
    .cz-bank{display:flex;flex-wrap:wrap;gap:6px;border:2px dashed #c4b5fd;border-radius:12px;padding:10px;margin-bottom:12px;justify-content:center}
    .cz-bank span{background:#fff;border:1px solid #ddd6fe;border-radius:8px;padding:2px 10px;font-weight:600;line-height:1.6}
    .gap{display:inline-flex;align-items:center;gap:6px;min-width:96px;border:0;border-bottom:2px solid #a78bfa;background:#f5f3ff;border-radius:8px 8px 2px 2px;padding:0 8px;font:inherit;line-height:1.65;cursor:pointer;color:#4c1d95;text-indent:0;vertical-align:baseline}
    .gap b{background:#7c3aed;color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;line-height:1.6}
    .gap.filled{background:#ede9fe;font-weight:600}
    span.gap{cursor:default}
    .gap.ok{background:#ecfdf5;border-color:#10b981;color:#065f46}.gap.ok b{background:#059669}
    .gap.bad{background:#fef2f2;border-color:#ef4444;color:#991b1b}.gap.bad b{background:#dc2626}
    .gap.bad s{opacity:.7}.gap .fix{color:#047857;font-weight:700}
    .gap.none{border-color:#f59e0b;background:#fffbeb;color:#92400e}.gap.none b{background:#d97706}
    .cz-qlist{margin-top:14px;border-top:1px dashed #ddd6fe;padding-top:10px;font-size:13.5px;display:grid;gap:6px}
    .cz-qlist .ok{color:#047857;font-weight:700}
    .czq{padding:14px 16px;transition:box-shadow .3s}.czq .qhead{margin-bottom:8px;gap:10px}
    .czq.flash{box-shadow:0 0 0 3px #c4b5fd}
    .czq .opts.xshort{grid-template-columns:repeat(4,minmax(0,1fr))}
    @media(max-width:600px){.czq .opts.xshort{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .exclock{font-weight:700;color:#6d28d9;white-space:nowrap}.exclock.low{color:#dc2626}
    @media(max-width:900px){.cz-ed{grid-template-columns:1fr}.cz-prev{position:static;max-height:none}}
    .ptext{white-space:pre-wrap;line-height:1.75;margin-top:10px;font-size:15.5px}
    audio{width:100%;margin:10px 0 6px}
    .ex-main{display:flex;flex-direction:column;gap:14px}
    .qhead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .qnum{font-weight:800;color:var(--violet-d)}
    .qtype{font-size:12px;color:var(--muted);background:#f5f2fb;padding:2px 8px;border-radius:6px}
    .qpts{font-size:12px;color:var(--warn);font-weight:600}
    .qtext{white-space:pre-wrap;font-size:16px;margin-bottom:12px;font-weight:500}
    .arr-hint{font-size:13px;color:#6d28d9;font-weight:600;margin:2px 0 8px}
    .arr{display:grid;gap:8px;margin:0 0 14px}
    .arr-row{display:flex;gap:12px;align-items:flex-start;background:#faf7ff;border:1px solid #ece5fb;border-radius:12px;padding:9px 14px;line-height:1.55;font-size:15.5px}
    .arr-k{flex:none;width:28px;height:28px;border-radius:50%;background:#7c3aed;color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;margin-top:-1px}
    .arr-sp{color:#6d28d9}
    .arr-order{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:10px 14px;margin-top:10px;display:grid;gap:6px;line-height:1.55}
    .arr-order>div{display:flex;gap:10px;align-items:flex-start}
    .arr-k.sm{width:22px;height:22px;font-size:12px;background:#059669;margin-top:1px}
    .arr-note{font-style:italic;color:#6b6480;padding:0 4px}
    .opts{display:grid;gap:8px}
    .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:all .12s}
    .opt:hover{border-color:#c4b5fd}
    .opt input{display:none}
    .opt b{width:26px;height:26px;border-radius:50%;background:#f3f0fa;display:grid;place-items:center;flex:none;font-size:13px}
    .opt.on{border-color:var(--violet);background:#f5f0ff}
    .opt.on b{background:var(--violet);color:#fff}
    .wc{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
    .submitbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);
      padding:12px clamp(12px,3vw,32px);display:flex;justify-content:space-between;align-items:center;gap:16px;z-index:15}
    .progress{display:flex;align-items:center;gap:12px;flex:1;max-width:520px}
    .bar{flex:1;height:8px;background:#efe9fa;border-radius:99px;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .2s}

    /* ================= KẾT QUẢ ================= */
    .score-card{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    .ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}
    .ring div{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:26px}
    .rv{border-left:5px solid var(--line)}
    .rv.ok{border-left-color:var(--ok)} .rv.bad{border-left-color:var(--bad)} .rv.essay{border-left-color:#a78bfa}
    .ans{display:grid;gap:6px;margin-top:6px;font-size:14px}
    .ans .k{color:var(--muted);display:inline-block;min-width:118px}
    .opt-line{padding:6px 10px;border-radius:8px;font-size:14px}
    .opt-line.right{background:var(--ok-bg);color:var(--ok);font-weight:600}
    .opt-line.wrong{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
    .explain{background:#faf7ff;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
    .essay-box{white-space:pre-wrap;background:#faf9fc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14.5px}

    /* ================= QUẢN TRỊ ================= */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
    .stat-card{border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);cursor:default}
    .stat-card b{display:block;font-size:34px;font-weight:800;line-height:1.1}
    .stat-card span{color:#55506a}
    .s1{background:#ffe4e9} .s1 b{color:#1f1235}
    .s2{background:#dff5ec} .s2 b{color:#059669}
    .s3{background:#e0f2fe} .s3 b{color:#0369a1}
    .s4{background:#ede9fe} .s4 b{color:#7c3aed}
    .s5{background:#fce7f3} .s5 b{color:#db2777}
    .s6{background:#ffedd5} .s6 b{color:#c2410c}
    .stat-card.click{cursor:pointer} .stat-card.click:hover{filter:brightness(.98)}
    .bank-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .toolbar .inp{width:auto;min-width:200px;flex:1;max-width:340px}
    .switch{position:relative;width:42px;height:24px;border-radius:99px;background:#d6d0e2;border:0;cursor:pointer;flex:none}
    .switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
    .switch.on{background:var(--ok)} .switch.on::after{left:21px}

    /* ================= SOẠN BÀI ================= */
    .q-edit{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fdfcff}
    .q-edit .top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
    .q-edit .opt-row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;margin-top:6px}
    .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .hint{font-size:13px;color:var(--muted);margin-top:4px}
    .sticky-save{position:sticky;bottom:0;background:rgba(255,255,255,.95);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:16px}

    /* ================= TRÒ CHƠI ================= */
    .game-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
    .game-tile{cursor:pointer;transition:transform .15s, box-shadow .15s}
    .game-tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(91,33,182,.14)}
    .game-tile .gi{font-size:36px;margin-bottom:6px}
    .game-tile.off{opacity:.45;cursor:not-allowed;transform:none}
    .game-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
    .gbtn{border:1px solid var(--line);background:#faf7ff;border-radius:10px;padding:5px 10px;font-size:13px;cursor:pointer;font-weight:600}
    .gbtn:hover{background:#ede9fe}
    .gbtn:disabled{opacity:.35;cursor:not-allowed}
    .gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
    .gstat{font-weight:700;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);font-size:14px}
    .fc{perspective:1200px;max-width:560px;margin:0 auto;height:300px;cursor:pointer}
    .fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
    .fc.flip .fc-in{transform:rotateY(180deg)}
    .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:0 14px 40px rgba(91,33,182,.18)}
    .fc-front{background:var(--grad);color:#fff}
    .fc-front .w{font-size:40px;font-weight:800;line-height:1.2}
    .fc-back{background:#fff;transform:rotateY(180deg)}
    .fc-back .m{font-size:26px;font-weight:700;color:var(--violet-d)}
    .fc-back .ex{margin-top:12px;color:var(--muted);font-style:italic}
    .speak{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:999px;padding:7px 16px;margin-top:14px;cursor:pointer;font-weight:600}
    .fc-actions{display:flex;gap:12px;justify-content:center;margin-top:22px}
    .match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .match .col{display:grid;gap:10px;align-content:start}

<body<? if (bannerUrl) { ?> style="--banner-img:url('<?!= bannerUrl ?>')"<? } ?>>
  <div id="busy"></div>
  <header class="topbar" id="topbar" hidden>
    <div class="brand" data-act="home"><div class="logo">P</div><span id="brandName"></span></div>
    <div class="nav" id="nav"></div>
  </header>
  <main id="app"></main>
  <div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toast"></div>

<script>
/* =====================================================================
   PHẦN GIAO DIỆN (chạy trên trình duyệt của học sinh/giáo viên)
   ===================================================================== */
var APP_NAME = <?!= JSON.stringify(appName) ?>;
var SCHOOL_NAME = <?!= JSON.stringify(schoolName) ?>;
var LEVELS = <?!= levelsJson ?>;
var SKILLS = <?!= skillsJson ?>;

const TYPE_LABEL = { mcq: 'Trắc nghiệm', fill: 'Điền / viết lại', essay: 'Tự luận' };
const SKILL_COLOR = {
  'Ngữ pháp': ['#ede9fe', '#6d28d9'], 'Từ vựng': ['#dcfce7', '#047857'], 'Đọc hiểu': ['#e0f2fe', '#0369a1'],
  'Nghe': ['#fce7f3', '#be185d'], 'Viết': ['#ffedd5', '#c2410c'], 'Tổng hợp': ['#f1f5f9', '#334155']
};

// Trạng thái của ứng dụng
const S = {
  token: load('token'), user: null,
  catalog: null, level: '', sub: '', skill: '',
  ex: null, answers: {},
  adminTab: 'overview', adm: {}, f: { bankLevel: '', bankSub: '', bankQ: '', resLevel: '', resState: '', resQ: '', userQ: '', userRole: '', setLevel: '', asgClass: '', examGrade: '' },
  edit: null
};
const app = document.getElementById('app');

/* ---------------- Tiện ích nhỏ ---------------- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function store(k, v) { try { if (v == null) localStorage.removeItem('ea_' + k); else localStorage.setItem('ea_' + k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem('ea_' + k)); } catch (e) { return null; } }
function fmtDate(iso) {
  if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return esc(iso);
  return d.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtNum(n) { n = Number(n) || 0; return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); }
function wordCount(s) { return (String(s).trim().match(/\S+/g) || []).length; }
function levelName(id) { const l = LEVELS.find(x => x.id === id); return l ? l.name : (id || ''); }
function skillTag(s) { const c = SKILL_COLOR[s] || SKILL_COLOR['Tổng hợp']; return `<span class="skill" style="background:${c[0]};color:${c[1]}">${esc(s)}</span>`; }
function pctTag(p) {
  if (p == null) return '<span class="tag warn">Chờ chấm</span>';
  return `<span class="tag ${p >= 80 ? 'ok' : p >= 50 ? '' : 'bad'}">${p}%</span>`;
}
function toast(msg, type) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 3200);
}
function busy(on) { document.body.classList.toggle('busy', !!on); }
function skeleton(n) { return `<div class="page"><div class="grid">${'<div class="skeleton"></div>'.repeat(n || 6)}</div></div>`; }

/** Gọi máy chủ Apps Script */
function call(action, payload) {
  busy(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => {
        busy(false);
        if (res && res.ok) return resolve(res.data);
        if (res && res.error === 'AUTH') { forceLogout(); return reject(new Error('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.')); }
        reject(new Error(res && res.error ? res.error : 'Có lỗi xảy ra.'));
      })
      .withFailureHandler(err => { busy(false); reject(new Error(err && err.message ? err.message : 'Mất kết nối, thử lại nhé.')); })
      .api(action, payload || {}, S.token);
  });
}
/** Chạy một việc, nếu lỗi thì hiện thông báo */
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, 'err'); } }

/* ---------------- Hộp thoại ---------------- */
function openModal(html, wide) { const b = $('#modalBox'); b.className = 'modal-box' + (wide ? ' wide' : ''); b.innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; $('#modalBox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox(msg, okText, danger) {
  return new Promise(res => {
    openModal(`<h3>Xác nhận</h3><p>${esc(msg)}</p><div class="m-actions"><button class="btn" id="mNo">Huỷ</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" id="mYes">${esc(okText || 'Đồng ý')}</button></div>`);
    $('#mNo').onclick = () => { closeModal(); res(false); };
    $('#mYes').onclick = () => { closeModal(); res(true); };
  });
}
function promptBox(title, label, type) {
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><label class="f">${esc(label)}</label><input class="inp" id="mIn" type="${type || 'text'}">
      <div class="m-actions"><button class="btn" id="mNo">Huỷ</button><button class="btn primary" id="mYes">Lưu</button></div>`);
    $('#mIn').focus();
    $('#mNo').onclick = () => { closeModal(); res(null); };
    $('#mYes').onclick = () => { const v = $('#mIn').value; closeModal(); res(v); };
  });
}

/* ---------------- Bắt sự kiện bấm nút (data-act) ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
['input', 'change'].forEach(evt => document.addEventListener(evt, onField));

const ACTS = {
  home: () => goHome(),
  practice: () => showPractice(),
  myResults: () => showMyResults(),
  admin: d => showAdmin(d.tab || S.adminTab),
  menu: () => openUserMenu(),
  logout: () => doLogout(),
  changePw: () => changePassword(),
  closeModal: () => closeModal(),
  authMode: d => showAuth(d.mode),
  // luyện tập
  level: d => { S.level = d.id; S.sub = ''; renderPractice(); },
  sub: d => { S.sub = d.id; renderPractice(); },
  skill: d => { S.skill = d.id; renderPractice(); },
  openEx: d => openExercise(d.id),
  submit: () => submitExercise(),
  viewResult: d => run(async () => showResult(await call('resultDetail', { id: d.id }), true)),
  retry: d => openExercise(d.id),
  // quản trị
  approve: d => setStatus(d.id, 'approved'),
  reject: d => setStatus(d.id, 'rejected'),
  lock: d => setStatus(d.id, 'locked'),
  unlock: d => setStatus(d.id, 'approved'),
  approveAll: () => approveAll(),
  makeTeacher: d => setRole(d.id, 'teacher'),
  makeStudent: d => setRole(d.id, 'student'),
  resetPw: d => resetPw(d.id, d.name),
  gradeOpen: d => openGrade(d.id),
  gradeSave: d => saveGrade(d.id),
  newEx: () => showEditor(null),
  newCloze: () => showEditor(null, 'cloze'),
  czBank: d => { S.edit.showBank = d.id === 'on'; if (d.id === 'off') S.edit.exercise.wordBank = ''; renderEditor(); },
  czSample: () => czSample(),
  czStatus: () => { S.edit.exercise.status = S.edit.exercise.status === 'closed' ? 'open' : 'closed'; renderEditor(); },
  czGo: d => czGo(d.id),
  editEx: d => showEditor(d.id),
  previewEx: d => openExercise(d.id, true),
  toggleEx: d => toggleEx(d.id),
  delEx: d => deleteEx(d.id, d.title),
  bankLevel: d => { S.f.bankLevel = d.id; S.f.bankSub = ''; renderAdmin(); },
  openSheet: () => { if (S.adm.overview) window.open(S.adm.overview.sheetUrl, '_blank'); },
  // soạn bài
  qAdd: d => { S.edit.questions.push(blankQ(d.type)); renderEditor(); scrollToQ(S.edit.questions.length - 1); },
  qDel: d => { S.edit.questions.splice(+d.i, 1); renderEditor(); },
  qUp: d => moveQ(+d.i, -1),
  qDown: d => moveQ(+d.i, 1),
  quick: () => openQuickImport(),
  quickDo: () => doQuickImport(),
  saveEx: () => saveExercise(),
  cancelEdit: () => showAdmin('bank'),
  // trò chơi
  games: () => showGames(),
  gLevel: d => { G.level = d.id; renderGames(); },
  openSet: d => openSet(d.id),
  setHome: () => renderSetHome(),
  lbGame: d => { G.lbGame = d.game; renderSetHome(); },
  play: d => play(d),
  speak: d => speak(d.text),
  fcFlip: () => { const c = $('#fc'); if (c) c.classList.toggle('flip'); },
  fcAns: d => fcAns(+d.k),
  fcReview: () => { G.t0 = Date.now(); fcStart(shuffle(G.st.unknown), true); },
  mPick: d => mPick(d),
  scPick: d => scPick(+d.j),
  scRemove: d => scRemove(+d.j),
  scCheck: () => scCheck(),
  scSkip: () => scSkip(),
  scNext: () => scNext(),
  spAns: d => spAnswer(+d.k),
  pcAns: d => pcAnswer(+d.k),
  slPick: d => slPick(+d.j),
  slRemove: d => slRemove(+d.k),
  slHint: () => slHint(),
  slSkip: () => slSkip(),
  setLevel: d => { S.f.setLevel = d.id; renderAdmin(); },
  newSet: () => showSetEditor(null),
  editSet: d => showSetEditor(d.id),
  toggleSet: d => toggleSet(d.id),
  delSet: d => deleteSet(d.id, d.title),
  saveSet: () => saveSet(),
  // giao bài
  doAsg: d => doAsg(d),
  newClass: () => newClass(),
  delClass: d => delClass(d.id, d.name),
  newAssign: () => openAssign(),
  assignEx: d => openAssign({ kind: 'exercise', refId: d.id }),
  assignSet: d => openAssign({ kind: 'wordset', refId: d.id }),
  asgKind: d => { readAssignModal(); if (S.asg.kind !== d.kind) { S.asg.kind = d.kind; S.asg.refId = ''; S.asg.game = ''; } renderAssignModal(); },

/** Gõ phím / chọn đáp án */
function onField(e) {
  const el = e.target;
  // --- đang làm bài ---
  if (el.dataset.q && S.ex) {
    S.answers[el.dataset.q] = el.value;
    if (el.type === 'radio') el.closest('.opts').querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
    const wc = document.querySelector(`[data-wc="${el.dataset.q}"]`);
    if (wc) wc.textContent = wordCount(el.value) + ' từ';
    store('draft_' + S.ex.id, S.answers);
    updateProgress(); czSync();
  }
  // --- đang soạn bài ---
  if (S.edit && el.dataset.ef) {
    const k = el.dataset.ef;
    if (k === 'format') { if (e.type === 'change') setFormat(el.value); }
    else if (k === 'czText') S.edit.text = el.value;
    else S.edit.exercise[k] = el.value;
    if (k === 'level' && e.type === 'change') { S.edit.exercise.subLevel = ''; renderEditor(); }
    if (k !== 'format' && isCloze(S.edit.exercise.format)) czPreview();
  }
  if (S.edit && el.dataset.qf) {
    const q = S.edit.questions[+el.dataset.qi];
    q[el.dataset.qf] = el.value;
    if (el.dataset.qf === 'type' && e.type === 'change') renderEditor();
  }
  // --- đang soạn bộ từ ---
  if (S.setEdit && el.dataset.sf) onSetField(el, e.type);
  if (S.imp && el.dataset.imp) onImpField(el, e.type);
  if (el.dataset.xq && X.st) onExamField(el);
  if (S.xEdit && el.dataset.xe) onExamEditField(el, e.type);
  if (el.dataset.userclass && e.type === 'change') setUserClass(el.dataset.userclass, el.value);
  // --- bộ lọc quản trị ---
  if (el.dataset.filter) {
    S.f[el.dataset.filter] = el.type === 'checkbox' ? el.checked : el.value;
    if (e.type === 'input' && el.tagName === 'INPUT') { clearTimeout(onField._t); onField._t = setTimeout(renderAdmin, 200); }
    else if (e.type === 'change') renderAdmin();
  }
}

function questionHTML(q, i) {
  const v = S.answers[q.order] || '';

  } else if (q.type === 'fill') {
    body = `<input class="inp" data-q="${esc(q.order)}" value="${esc(v)}" placeholder="Nhập câu trả lời..." autocomplete="off" autocapitalize="off" spellcheck="false">`;
  } else {
    body = `<textarea class="inp" rows="8" data-q="${esc(q.order)}" placeholder="Viết bài của bạn ở đây...">${esc(v)}</textarea><div class="wc" data-wc="${esc(q.order)}">${wordCount(v)} từ</div>`;
  }
  return `<div class="card" id="q-${esc(q.order)}"><div class="qhead"><span class="qnum">Câu ${i + 1}</span><span class="qtype">${isArr(q.question) ? 'Sắp xếp' : TYPE_LABEL[q.type]}</span>
    ${q.points !== 1 ? `<span class="qpts">${fmtNum(q.points)} điểm</span>` : ''}</div>${stemHTML(q.question)}${body}</div>`;
}

/** Sau khi nộp: hiện các câu theo thứ tự đúng (lấy từ phương án đúng, vd "c – a – e – b – d") */
function arrOrderHTML(t, key) {
  if (!isArr(t) || !key) return '';
  const map = {};
  String(t).split('\n').forEach(l => { const m = l.trim().match(/^([a-e])\s*[.)]\s+(.*)$/); if (m) map[m[1]] = m[2]; });
  const order = (String(key).match(/[a-e]/g) || []).filter(k => map[k]);
  if (order.length < 3) return '';
  return `<div class="arr-order"><b>✅ Thứ tự đúng:</b>${order.map(k => { const sp = map[k].match(/^([^:]{1,24}):\s+(.*)$/);
    return `<div><span class="arr-k sm">${k}</span><div>${sp ? `<b class="arr-sp">${esc(sp[1])}:</b> ${esc(sp[2])}` : esc(map[k])}</div></div>`; }).join('')}</div>`;
}

/* ---- Câu sắp xếp (arrangement): các dòng a. b. c. … hiện thành thẻ có chữ cái; "Tên: lời" in đậm tên ---- */
function isArr(t) { return String(t || '').split('\n').filter(l => /^[a-e]\s*[.)]\s+/.test(l.trim())).length >= 3; }
function stemHTML(t, f) {
  f = f || esc;
  if (!isArr(t)) return `<div class="qtext">${f(t)}</div>`;
  const rows = String(t).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^([a-e])\s*[.)]\s+(.*)$/);
    if (!m) return `<div class="arr-note">${f(l)}</div>`;
    const sp = m[2].match(/^([^:]{1,24}):\s+(.*)$/);
    return `<div class="arr-row"><span class="arr-k">${m[1]}</span><div>${sp ? `<b class="arr-sp">${f(sp[1])}:</b> ${f(sp[2])}` : f(m[2])}</div></div>`;
  }).join('');
  return `<div class="arr-hint">🔀 Chọn thứ tự đúng của các câu / lượt lời:</div><div class="arr">${rows}</div>`;
}

function updateProgress() {
  if (!S.ex || !$('#pbar')) return;
  const total = S.ex.questions.length;
  const done = S.ex.questions.filter(q => String(S.answers[q.order] || '').trim()).length;
  $('#pbar').style.width = (total ? done / total * 100 : 0) + '%';
  $('#ptext').textContent = `Đã làm ${done}/${total} câu`;
}

async function submitExercise(force) {
  const e = S.ex; if (!e) return;
  const missing = e.questions.filter(q => !String(S.answers[q.order] || '').trim()).length;
  if (!force && missing && !(await confirmBox(`Bạn còn ${missing} câu chưa làm. Vẫn nộp bài chứ?`, 'Nộp bài'))) return;
  await run(async () => {
    const r = await call('submit', { id: e.id, answers: S.answers });
    store('draft_' + e.id, null); store('start_' + e.id, null);
    clearInterval(S.exTimer); S.exTimer = null;
    S.ex = null;
    showResult(r);
  });
}

/* =====================================================================
   KẾT QUẢ
   ===================================================================== */
function scoreSummary(r) {
  const p = r.needsReview ? null : r.percent;
  const color = p == null ? '#a78bfa' : p >= 80 ? '#059669' : p >= 50 ? '#7c3aed' : '#dc2626';
  const ring = `conic-gradient(${color} ${(p || 0) * 3.6}deg, #efe9fa 0)`;
  let line;
  if (r.needsReview) {
    line = r.autoTotal ? `Phần chấm tự động: <b>${fmtNum(r.autoScore)}/${fmtNum(r.autoTotal)}</b> điểm.<br>Phần tự luận (${fmtNum(r.essayTotal)} điểm) đang chờ thầy cô chấm.`
      : `Bài tự luận (${fmtNum(r.essayTotal)} điểm) đang chờ thầy cô chấm.`;
  } else {
    const got = r.autoScore + (r.essayScore || 0), tot = r.autoTotal + r.essayTotal;
    line = `Bạn đạt <b>${fmtNum(got)}/${fmtNum(tot)}</b> điểm.` + (r.essayTotal ? ` (Tự luận: ${fmtNum(r.essayScore)}/${fmtNum(r.essayTotal)})` : '');
  }
  const cheer = p == null ? '📝 Đã nộp bài!' : p >= 90 ? '🎉 Xuất sắc!' : p >= 70 ? '👏 Làm tốt lắm!' : p >= 50 ? '💪 Khá ổn, cố thêm chút nữa!' : '📚 Ôn lại và thử lần nữa nhé!';
  return `<div class="card score-card">
    <div class="ring" style="background:${ring}"><div style="color:${color}">${p == null ? '…' : p + '%'}</div></div>
    <div style="flex:1;min-width:220px"><h2>${cheer}</h2><p style="margin:6px 0 0">${line}</p>
      <p class="muted small" style="margin:6px 0 0">${esc(r.title)} · ${esc(levelName(r.level))} · ${esc(r.subLevel)} · ${fmtDate(r.submittedAt)}</p>
      ${r.teacherComment ? `<div class="explain" style="margin-top:10px">💬 <b>Nhận xét của ${esc(r.reviewedBy || 'giáo viên')}:</b><br>${esc(r.teacherComment).replace(/\n/g, '<br>')}</div>` : ''}
    </div></div>`;
}

function reviewItems(r) {
  const gaps = isCloze(r.format) ? gapNums(r.passage) : [];
  return r.items.map((it, i) => {
    let cls = it.type === 'essay' ? 'essay' : it.correct ? 'ok' : 'bad';
    let status = it.type === 'essay' ? '<span class="tag warn">Tự luận</span>' : it.correct ? '<span class="tag ok">✓ Đúng</span>' : '<span class="tag bad">✗ Sai</span>';
    let body = '';
    if (it.type === 'mcq') {
      body = `<div class="ans">${Object.keys(it.options || {}).map(k => {
        const right = k === it.answerText, chosen = k === String(it.given).toUpperCase();
        return `<div class="opt-line ${right ? 'right' : chosen ? 'wrong' : ''}"><b>${k}.</b> ${esc(it.options[k])}${right ? ' ✓' : ''}${chosen && !right ? ' (bạn chọn)' : ''}</div>`;
      }).join('')}${!it.given ? '<div class="muted small">Bạn chưa chọn đáp án.</div>' : ''}</div>`;
    } else if (it.type === 'fill') {
      body = `<div class="ans"><div><span class="k">Bạn trả lời:</span> <b style="color:${it.correct ? 'var(--ok)' : 'var(--bad)'}">${it.given ? esc(it.given) : '<i class="muted">(bỏ trống)</i>'}</b></div>
        ${!it.correct ? `<div><span class="k">Đáp án đúng:</span> <b style="color:var(--ok)">${esc(it.answerText)}</b></div>` : ''}</div>`;
    } else {
      body = `<div class="essay-box">${it.given ? esc(it.given) : '<i class="muted">(bỏ trống)</i>'}</div><div class="wc">${wordCount(it.given)} từ</div>`;
    }
    return `<div class="card rv ${cls}"><div class="qhead"><span class="qnum">Câu ${esc(gaps[i] || i + 1)}</span>${status}<span class="qpts">${fmtNum(it.points)} điểm</span></div>
      ${isGapStem(it.question) ? '' : stemHTML(it.question)}${body}${arrOrderHTML(it.question, (it.options || {})[it.answerText])}
      ${it.explanation ? `<div class="solution">💡 <b>Lời giải chi tiết:</b> ${esc(it.explanation)}</div>` : ''}</div>`;
  }).join('');
}

async function setStatus(id, status) {
  if (status === 'rejected' && !(await confirmBox('Từ chối tài khoản này?', 'Từ chối', true))) return;
  if (status === 'locked' && !(await confirmBox('Khoá tài khoản này? Học sinh sẽ không đăng nhập được.', 'Khoá', true))) return;
  await run(async () => {
    await call('setUserStatus', { userId: id, status });
    const u = S.adm.users.find(x => x.id === id); if (u) u.status = status;
    if (S.adm.overview && status !== 'locked') S.adm.overview.pending = S.adm.users.filter(x => x.status === 'pending').length;
    toast(status === 'approved' ? 'Đã duyệt / mở khoá' : status === 'locked' ? 'Đã khoá tài khoản' : 'Đã từ chối', 'ok');
    renderAdmin();
  });
}
async function approveAll() {
  if (!(await confirmBox('Duyệt tất cả tài khoản đang chờ?', 'Duyệt tất cả'))) return;
  await run(async () => { const n = await call('approveAll'); toast(`Đã duyệt ${n} tài khoản`, 'ok'); S.adm.overview = null; await loadAdmin('pending'); });
}
async function setRole(id, role) {
  const msg = role === 'teacher' ? 'Cấp quyền giáo viên cho tài khoản này? Họ sẽ vào được trang Quản trị.' : 'Bỏ quyền giáo viên của tài khoản này?';
  if (!(await confirmBox(msg, 'Đồng ý'))) return;
  await run(async () => { await call('setRole', { userId: id, role }); const u = S.adm.users.find(x => x.id === id); if (u) { u.role = role; u.status = 'approved'; } toast('Đã cập nhật vai trò', 'ok'); renderAdmin(); });

async function resetPw(id, name) {

/* =====================================================================
   DẠNG BÀI GUIDED CLOZE (A, B, C, D) / OPEN CLOZE (điền từ)
   Bài đọc ghi chỗ trống {{26}}, {{27}}…; câu hỏi chỉ cần số + phương án + đáp án.
   ===================================================================== */
const FORMATS = { '': 'Thông thường (nhiều dạng câu)', cloze: 'Guided cloze (A, B, C, D)', open: 'Open cloze (điền từ)' };
const isCloze = f => f === 'cloze' || f === 'open';
const gapNums = t => [...String(t || '').matchAll(/\{\{\s*(\d+)\s*\}\}/g)].map(m => m[1]);
const isGapStem = s => /^\(\d+\)$/.test(String(s || '').trim());
const CZ_HINT = {
  cloze: 'Đoạn văn có <b>{{26}}</b>, <b>{{27}}</b>…; mỗi câu chỉ cần 4 phương án A–D (không cần ghi câu hỏi).',
  open: 'Đoạn văn có <b>{{1}}</b>, <b>{{2}}</b>…; mỗi câu chỉ cần ghi <b>Đáp án:</b> (nhiều đáp án đúng ngăn bằng dấu <b>|</b>).'
};
const CZ_SAMPLE = {
  cloze: { passage: `# The School Music Club

Our school music club {{1}} in 2015. Every Friday afternoon, students {{2}} love music meet in Room 12 to practise together. Last month, the club gave a concert to {{3}} money for a local library.`,
    text: `1.
A. starts
B. started
C. has started
D. starting
Đáp án: B
Giải thích: "in 2015" là mốc thời gian trong quá khứ → quá khứ đơn.

2. A. who  B. which  C. whose  D. where
Đáp án: A
Giải thích: Đại từ quan hệ thay cho người (students) làm chủ ngữ → who.

3.
A. rise
B. raise
C. grow
D. lift
Đáp án: B
Giải thích: Cụm cố định: raise money = gây quỹ.` },
  open: { passage: `# A Trip to the Floating Market

Last weekend, my family got up {{1}} five o'clock to visit the floating market. There were hundreds {{2}} boats on the river, and each boat sold a different kind of fruit.`,
    text: `1.
Đáp án: at
Giải thích: at + giờ.

2.
Đáp án: of
Giải thích: hundreds of + danh từ số nhiều.` }
};

/** Bài đọc có chỗ trống → HTML. gap(n, i) trả về HTML của chỗ trống thứ i (số n). */
function clozeHTML(t, gap) {
  let i = 0;
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(par => {
    par = par.trim(); if (!par) return '';
    const g = h => h.replace(/\{\{\s*(\d+)\s*\}\}/g, (m, n) => gap(n, i++));
    const lines = par.split('\n');
    if (lines.every(l => /^#\s+/.test(l) || /^=\s+/.test(l)))
      return lines.map(l => /^#\s+/.test(l) ? `<h3 class="cz-title">${g(fmt(l.replace(/^#\s+/, '')))}</h3>` : `<div class="cz-center">${g(fmt(l.replace(/^=\s+/, '')))}</div>`).join('');
    if (lines.every(l => /^-\s+/.test(l))) return '<ul class="cz-ul">' + lines.map(l => `<li>${g(fmt(l.replace(/^-\s+/, '')))}</li>`).join('') + '</ul>';
    return '<p class="cz-p">' + g(fmt(par).replace(/\n/g, '<br>')) + '</p>';
  }).join('');
}
function wordBankHTML(wb) {
  const w = String(wb || '').split(/\s*[,;|\n]\s*/).map(x => x.trim()).filter(Boolean);
  return w.length ? `<div class="cz-bank">${w.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '';
}

/** Tách một dòng "A. go B. goes C. going D. went" thành các phương án */
function splitInlineOpts(line) {
  if (!/^A\s*[.)]\s*\S/.test(line) || !/\sB\s*[.)]\s*\S/.test(line)) return null;
  const parts = line.split(/(?:^|\s+)([A-E])\s*[.)]\s+/).slice(1), o = {};
  for (let k = 0; k < parts.length; k += 2) o[parts[k]] = (parts[k + 1] || '').trim();
  return o.A && o.B ? o : null;
}

/** Đọc ô "Câu hỏi và đáp án" của bài cloze → { qs, errors, warns } (qs theo thứ tự chỗ trống trong bài) */
function parseCloze(text, passage, format) {
  const gaps = gapNums(passage), errors = [], warns = [], got = [];
  String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach((block, bi) => {
    const q = { type: format === 'open' ? 'fill' : 'mcq', question: '', A: '', B: '', C: '', D: '', answer: '', explanation: '', points: 1 };
    let n = '', stem = [];
    block.split('\n').map(l => l.trim()).filter(Boolean).forEach((l, li) => {
      let m;
      if (li === 0 && (m = l.match(/^(?:câu|question)?\s*\(?(\d+)\)?\s*[.):]?\s*(.*)$/i))) { n = m[1]; l = m[2]; if (!l) return; }
      const inl = splitInlineOpts(l);
      if (inl) { Object.assign(q, inl); return; }
      if ((m = l.match(/^([A-D])\s*[.)]\s*(.*)$/))) q[m[1]] = m[2].trim();
      else if ((m = l.match(/^(đáp án|dap an|answer|key)\s*[:：]\s*(.*)$/i))) q.answer = m[2].trim();
      else if ((m = l.match(/^(giải thích|giai thich|explanation)\s*[:：]\s*(.*)$/i))) q.explanation = m[2].trim();
      else stem.push(l);
    });
    const label = n ? `Câu ${n}` : `Khối câu thứ ${bi + 1}`;
    q.question = stem.join('\n');
    if (q.type === 'mcq') {
      q.answer = (q.answer.match(/^[A-D]/i) || [''])[0].toUpperCase();
      if (!q.A || !q.B) errors.push(`${label}: cần ít nhất 2 phương án A và B.`);
      else if (!q.answer || !q[q.answer]) errors.push(`${label}: thiếu hoặc sai dòng “Đáp án: A/B/C/D”.`);
    } else if (!q.answer) errors.push(`${label}: thiếu dòng “Đáp án: …”.`);
    got.push({ n, q });
  });
  // ghép câu với chỗ trống: theo số; câu không ghi số thì lấp chỗ trống còn thiếu theo thứ tự
  const byGap = {};
  got.filter(g => g.n).forEach(g => {
    if (gaps.indexOf(g.n) < 0) errors.push(`Câu ${g.n}: bài đọc không có chỗ trống {{${g.n}}}.`);
    else if (byGap[g.n]) errors.push(`Câu ${g.n} bị ghi hai lần.`);
    else byGap[g.n] = g.q;
  });
  got.filter(g => !g.n).forEach(g => { const free = gaps.find(x => !byGap[x]); if (free) byGap[free] = g.q; else errors.push('Có câu không ghi số và không còn chỗ trống để ghép.'); });
  if (!gaps.length) errors.push('Bài đọc chưa có chỗ trống nào. Ghi {{1}}, {{2}}… vào chỗ cần điền.');
  gaps.forEach((g, i) => { if (gaps.indexOf(g) !== i) errors.push(`Chỗ trống {{${g}}} xuất hiện hai lần trong bài đọc.`); });
  const missing = gaps.filter(g => !byGap[g]);
  if (missing.length && got.length) warns.push('Chỗ trống chưa có câu hỏi: ' + missing.map(g => `{{${g}}}`).join(', ') + '.');
  const qs = gaps.filter((g, i) => byGap[g] && gaps.indexOf(g) === i).map(g => { const q = byGap[g]; if (!q.question) q.question = `(${g})`; q.__gap = g; return q; });
  return { qs, errors, warns, gaps };
}

/** Câu hỏi đã lưu → chữ trong ô "Câu hỏi và đáp án" */
function clozeQText(qs, passage) {
  const gaps = gapNums(passage);
  return qs.map((q, i) => {
    const n = gaps[i] || (String(q.question).match(/^\((\d+)\)$/) || [])[1] || String(i + 1);
    const out = [`${n}.` + (q.question && !isGapStem(q.question) ? ' ' + q.question : '')];
    if (q.type === 'mcq') ['A', 'B', 'C', 'D'].forEach(k => { if (q[k]) out.push(`${k}. ${q[k]}`); });
    out.push(`Đáp án: ${q.answer || ''}`);
    if (q.explanation) out.push(`Giải thích: ${q.explanation}`);
    return out.join('\n');
  }).join('\n\n');
}

function exTimerStart() {

  let st = load(key);
  if (!st || (Date.now() - st) / 1000 > limit + 600) { st = Date.now(); store(key, st); }  // lần làm mới
  const tick = () => {
    if (!S.ex || S.ex.id !== e.id || !document.getElementById('exClock')) { clearInterval(S.exTimer); S.exTimer = null; return; }
    const left = limit - (Date.now() - st) / 1000;

    if (left <= 0) { clearInterval(S.exTimer); S.exTimer = null; toast('Hết giờ! Bài được nộp tự động.', 'err'); submitExercise(true); }

function parseQuick(text) {
  return text.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(block => {
    const q = blankQ('mcq'); q.answer = '';
    const qLines = [];
    block.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      let m;
      const inl = splitInlineOpts(l);
      if (inl) Object.assign(q, inl);
      else if ((m = l.match(/^([A-D])\s*[.)]\s*(.*)$/))) q[m[1]] = m[2];
      else if ((m = l.match(/^(đáp án|dap an|answer|key|đ\/a)\s*[:：]\s*(.*)$/i))) q.answer = m[2].trim();
      else if ((m = l.match(/^(giải thích|giai thich|explanation|tiêu chí)\s*[:：]\s*(.*)$/i))) q.explanation = m[2].trim();
      else qLines.push(l);
    });
    q.question = qLines.join('\n').replace(/^(câu|question)?\s*\d+\s*[.):]\s*/i, '');
    if (/^\[(tự luận|tu luan|viết|essay)\]/i.test(q.question)) { q.type = 'essay'; q.points = 5; q.question = q.question.replace(/^\[[^\]]+\]\s*/, ''); }
    else if (!q.A && !q.B) q.type = 'fill';
    else q.answer = (q.answer.match(/[A-D]/i) || ['A'])[0].toUpperCase();
    return q;
  }).filter(q => q.question);
}

function doQuickImport() {
  const qs = parseQuick($('#quickText').value);
  if (!qs.length) return toast('Chưa đọc được câu nào. Kiểm tra lại định dạng nhé.', 'err');
  // bỏ câu trống mặc định nếu chưa nhập gì
  S.edit.questions = S.edit.questions.filter(q => q.question.trim());
  S.edit.questions.push(...qs);
  closeModal(); renderEditor();
  toast(`Đã thêm ${qs.length} câu. Kiểm tra lại rồi bấm Lưu.`, 'ok');
}

const IMG_BASE = 'https://lhthu1981-prog.github.io/practice-makes-perfect/img/';
const isImgRef = v => /^https?:\/\/\S+$/i.test(v || '') || /^[\w\-./]+\.(jpe?g|png|webp|gif)$/i.test(v || '');
function imgSrc(v) {
  v = String(v || '').trim(); if (!v) return '';
  const m = v.match(/drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800';
  return /^https?:/i.test(v) ? v : IMG_BASE + v.replace(/^\/+/, '');
}

/** Một dòng bộ từ đã tách theo dấu |  → { word, meaning, example, image } (ảnh là cột cuối nếu có) */
function wordFrom(p) {
  p = p.slice(); let image = '';
  if (p.length >= 3 && isImgRef(p[p.length - 1])) image = p.pop();
  return { word: p[0], meaning: p[1], example: p.slice(2).join(' ').trim(), image };
}
/* Kho ảnh: docs/img/kho.json liệt kê ảnh theo thư mục, vd { "lop7/unit4": ["orchestra.jpg", …] }.
   Từ nào chưa ghi ảnh thì tự tìm ảnh trùng tên trong kho: ưu tiên thư mục đúng lớp + Unit của bộ từ,
   rồi đến các thư mục cùng lớp, cuối cùng là cả kho. */
const KHO = { data: {}, p: null };
function loadKho() {
  if (!KHO.p) KHO.p = fetch(IMG_BASE + 'kho.json', { cache: 'no-cache' })
    .then(r => (r.ok ? r.json() : {})).catch(() => ({})).then(d => (KHO.data = d && typeof d === 'object' ? d : {}));
  return KHO.p;
}
const slugify = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
function khoTiers(set) {
  const g = (String(set.subLevel || '').match(/\d+/) || [])[0], u = (String(set.title || '').match(/unit\s*(\d+)/i) || [])[1];
  const all = Object.keys(KHO.data), unit = g && u ? all.filter(f => f === `lop${g}/unit${u}`) : [];
  const grade = g ? all.filter(f => f.indexOf(`lop${g}/`) === 0 && unit.indexOf(f) < 0) : [];
  return [unit, grade, all.filter(f => unit.indexOf(f) < 0 && grade.indexOf(f) < 0)];
}
function khoFind(set, word) {
  const s = slugify(word); if (!s) return '';
  const names = [s, s + 's', s + 'es', s.replace(/e?s$/, '')];
  for (const tier of khoTiers(set)) for (const f of tier) {
    const files = KHO.data[f] || [];
    for (const n of names) { const hit = files.find(x => x.replace(/\.\w+$/, '') === n); if (hit) return f + '/' + hit; }
  }
  return '';
}
function khoUnitCount(set) { const t = khoTiers(set)[0]; return t.length ? (KHO.data[t[0]] || []).length : 0; }
function withPics(set) {
  set.words.forEach(w => { if (!w.image) { const k = khoFind(set, w.word); if (k) { w.image = k; w.fromKho = true; } } });
  set.pictures = set.words.filter(w => w.image);
  return set;
}
async function loadSet(id) { const r = await Promise.all([call('wordSet', { id }), loadKho()]); return withPics(r[0]); }
const G = { sets: null, level: '', set: null, game: '', st: null, t0: 0, tick: null, tmo: null, lbGame: 'speed' };

function stopGame() { clearInterval(G.tick); clearTimeout(G.tmo); G.tick = G.tmo = null; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function speak(text) {
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function countOf(set, need) { return Array.isArray(set[need]) ? set[need].length : (set[need] || 0); }
function elapsed() { return (Date.now() - G.t0) / 1000; }
function fmtSec(s) { s = Math.round(s); return s >= 60 ? Math.floor(s / 60) + ' phút ' + (s % 60) + ' giây' : s + ' giây'; }

async function loadLb() {
  const el = () => $('#lb');
  try { const r = await call('leaderboard', { setId: G.set.id, game: G.lbGame }); if (el()) el().innerHTML = lbHTML(r); }
  catch (e) { if (el()) el().textContent = e.message; }
}

function lbHTML(r) {
  if (!r.top.length) return '<div class="empty" style="padding:20px">Chưa ai chơi trò này. Hãy là người đầu tiên! 🚀</div>';
  const medal = n => ['🥇', '🥈', '🥉'][n - 1] || n;
  const row = x => `<tr class="${x.me ? 'me' : ''}"><td class="medal">${medal(x.rank)}</td>
    <td>${esc(x.fullName)}${x.className ? ` <span class="muted small">${esc(x.className)}</span>` : ''}${x.me ? ' <span class="tag" style="background:#ede9fe;color:#6d28d9">Bạn</span>' : ''}</td>
    <td><b>${x.score}</b> điểm</td><td class="muted small">${x.correct}/${x.total} đúng · ${fmtSec(x.seconds)}</td></tr>`;
  const meRow = r.me && r.me.rank > 10 ? `<tr><td colspan="4" class="muted small" style="text-align:center">⋯</td></tr>` + row(r.me) : '';
  return `<table class="lb"><tbody>${r.top.map(row).join('')}${meRow}</tbody></table>
    <div class="muted small" style="margin-top:6px">${r.players} bạn đã chơi${r.me ? ` · Hạng của bạn: <b>${r.me.rank}</b>` : ''}</div>`;
}

/* ---------- Bắt đầu một trò ---------- */
async function play(d) {
  if (!G.set || G.set.id !== d.id) {
    app.innerHTML = skeleton(2);
    try { G.set = await loadSet(d.id); } catch (e) { return toast(e.message, 'err'); }
  }
  renderTopbar('games');
  window.scrollTo(0, 0);
  G.game = d.game;
  G.t0 = Date.now();
  if (d.game === 'flashcard') fcStart(shuffle(G.set.words), false);
  else if (d.game === 'match') mStart();
  else if (d.game === 'scramble') scStart();
  else if (d.game === 'picture') pcStart();
  else if (d.game === 'spelling') slStart();
  else spStart();
}

function gameHead(stats) {
  return `<button class="back" data-act="setHome">← ${esc(G.set.title)}</button>
    <h1>${GAMES[G.game].icon} ${GAMES[G.game].name}</h1><div class="gbar">${stats}</div>`;
}

/** Màn hình kết thúc: lưu điểm và hiện bảng xếp hạng */
async function gameEnd(r) {
  stopGame();
  r.seconds = Math.round(r.seconds);
  const isFc = G.game === 'flashcard';
  const pct = r.total ? Math.round(r.correct / r.total * 100) : 0;
  const cheer = pct >= 90 ? '🎉 Tuyệt vời!' : pct >= 70 ? '👏 Giỏi lắm!' : pct >= 50 ? '💪 Cố lên chút nữa!' : '📚 Luyện thêm nhé!';
  app.innerHTML = `<div class="page" style="max-width:780px">
    <button class="back" data-act="setHome">← ${esc(G.set.title)}</button>
    <div class="card score-card" style="margin-top:6px">
      <div class="ring" style="background:conic-gradient(var(--violet) ${pct * 3.6}deg,#efe9fa 0)"><div style="color:var(--violet-d);font-size:22px">${isFc ? r.correct + '/' + r.total : r.score}</div></div>
      <div style="flex:1;min-width:220px"><h2>${cheer}</h2>
        <p style="margin:6px 0 0">${isFc ? `Bạn đã thuộc <b>${r.correct}/${r.total}</b> từ` : `Đúng <b>${r.correct}/${r.total}</b> · <b>${r.score}</b> điểm`} · ${fmtSec(r.seconds)}</p>${r.note || ''}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0">${r.extra || ''}
      <button class="btn primary" data-act="play" data-game="${G.game}" data-id="${esc(G.set.id)}">↻ Chơi lại</button>
      <button class="btn" data-act="setHome">Chọn trò khác</button></div>
    ${isFc ? '' : `<div class="card"><h3>🏆 Bảng xếp hạng: ${GAMES[G.game].name}</h3><div id="lb" class="muted" style="margin-top:8px">Đang lưu điểm…</div></div>`}
  </div>`;
  if (r.noSave) return;
  try {
    const lb = await call('saveScore', { setId: G.set.id, game: G.game, score: r.score, correct: r.correct, total: r.total, seconds: r.seconds });
    const el = $('#lb'); if (el) el.innerHTML = lbHTML(lb);
  } catch (e) {
    const el = $('#lb');
    if (/không hợp lệ/i.test(e.message)) { if (el) el.innerHTML = '⚠️ Máy chủ Apps Script chưa cập nhật bản mới nên chưa lưu được điểm trò này. Giáo viên dán Code.gs mới và tạo Phiên bản mới là lưu được.'; }
    else toast('Không lưu được điểm: ' + e.message, 'err');
  }
}

/* ---------- 1. Flashcard ---------- */
function fcStart(deck, review) {
  G.st = { deck, i: 0, known: 0, unknown: [], review };
  deck.forEach(w => preload(w.image));
  if (!review) G.t0 = Date.now();
  fcRender();
}
function fcRender() {
  const st = G.st, w = st.deck[st.i];
  app.innerHTML = `<div class="page" style="max-width:780px">
    ${gameHead(`<span class="gstat">Thẻ ${st.i + 1}/${st.deck.length}</span><span class="gstat">😊 Đã thuộc: ${st.known}</span>${st.review ? '<span class="gstat">🔁 Ôn lại</span>' : ''}`)}
    <div class="fc ${w.image ? 'pic' : ''}" id="fc" data-act="fcFlip"><div class="fc-in">
      <div class="fc-face fc-front">${w.image ? imgTag(w.image, 'fc-img') : ''}<div class="w">${esc(w.word)}</div>
        <button class="speak" data-act="speak" data-text="${esc(w.word)}">🔊 Nghe</button>
        <div class="small" style="opacity:.85;margin-top:14px">Chạm vào thẻ để lật</div></div>
      <div class="fc-face fc-back">${w.image ? imgTag(w.image, 'fc-img') : ''}<div class="m">${esc(w.meaning)}</div>
        ${w.example ? `<div class="ex">“${esc(w.example)}”</div><button class="speak" style="background:#f3f0fa;color:var(--violet-d)" data-act="speak" data-text="${esc(w.example)}">🔊 Nghe câu ví dụ</button>` : ''}</div>
    </div></div>
    <div class="fc-actions"><button class="btn" data-act="fcAns" data-k="0">😕 Chưa thuộc</button><button class="btn primary" data-act="fcAns" data-k="1">😊 Đã thuộc</button></div>
  </div>`;
}
function preload(v) { if (v) { const im = new Image(); im.src = imgSrc(v); } }
function fcAns(k) {
  const st = G.st;
  if (k) st.known++; else st.unknown.push(st.deck[st.i]);
  st.i++;
  if (st.i < st.deck.length) return fcRender();
  gameEnd({
    score: st.known, correct: st.known, total: st.deck.length, seconds: elapsed(), noSave: st.review,
    extra: st.unknown.length ? `<button class="btn" data-act="fcReview">🔁 Ôn lại ${st.unknown.length} từ chưa thuộc</button>` : ''
  });
}

/* ---------- 2. Ghép từ – nghĩa ---------- */
function mStart() {
  const words = shuffle(G.set.words);
  const rounds = [];
  for (let i = 0; i < words.length; i += 6) rounds.push(words.slice(i, i + 6));
  if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) { const last = rounds.pop(); rounds[rounds.length - 1] = rounds[rounds.length - 1].concat(last); }
  G.st = { rounds, r: 0, matched: 0, total: words.length, mistakes: 0, sel: null };
  G.t0 = Date.now();
  mRound();
  G.tick = setInterval(() => { const el = $('#mTime'); if (el) el.textContent = '⏱ ' + Math.floor(elapsed()) + ' giây'; }, 500);
}
function mRound() {
  const st = G.st, ws = st.rounds[st.r];
  st.left = shuffle(ws.map((w, i) => ({ i, t: w.word })));
  st.right = shuffle(ws.map((w, i) => ({ i, t: w.meaning })));
  st.done = {}; st.sel = null;
  mRender();
}
function mRender() {
  const st = G.st;
  const btn = (side, x) => `<button class="mt ${st.done[x.i] ? 'done' : ''} ${st.sel && st.sel.side === side && st.sel.i === x.i ? 'sel' : ''}"
    data-act="mPick" data-side="${side}" data-i="${x.i}" ${st.done[x.i] ? 'disabled' : ''}>${esc(x.t)}</button>`;
  app.innerHTML = `<div class="page" style="max-width:900px">
    ${gameHead(`<span class="gstat" id="mTime">⏱ ${Math.floor(elapsed())} giây</span><span class="gstat">✅ ${st.matched}/${st.total}</span>
      <span class="gstat">❌ ${st.mistakes}</span><span class="gstat">Vòng ${st.r + 1}/${st.rounds.length}</span>`)}
    <div class="match"><div class="col">${st.left.map(x => btn('L', x)).join('')}</div><div class="col">${st.right.map(x => btn('R', x)).join('')}</div></div>
  </div>`;
}
function mPick(d) {
  const st = G.st, i = +d.i, side = d.side;
  if (st.done[i]) return;
  if (!st.sel || st.sel.side === side) {
    st.sel = { side, i };
    if (side === 'L') speak(st.left.find(x => x.i === i).t);
    return mRender();
  }
  if (st.sel.i === i) {
    st.done[i] = true; st.matched++; st.sel = null;
    mRender();
    if (Object.keys(st.done).length === st.rounds[st.r].length) {
      G.tmo = setTimeout(() => { st.r++; if (st.r >= st.rounds.length) mEnd(); else mRound(); }, 450);
    }
  } else {
    st.mistakes++;
    const other = st.sel; st.sel = null;
    mRender();
    document.querySelectorAll(`.mt[data-side="${side}"][data-i="${i}"], .mt[data-side="${other.side}"][data-i="${other.i}"]`).forEach(b => b.classList.add('wrong'));
  }
}
function mEnd() {
  const st = G.st, sec = elapsed();
  gameEnd({
    score: Math.max(0, Math.round(st.total * 100 - st.mistakes * 25 - sec * 2)),
    correct: Math.max(0, st.total - st.mistakes), total: st.total, seconds: sec,
    note: `<p class="muted small" style="margin:4px 0 0">Ghép sai ${st.mistakes} lần. Điểm = 100 × số cặp − 25 × lần sai − 2 × số giây</p>`
  });
}

/* ---------- 3. Sắp xếp câu ---------- */
function scStart() {
  G.st = { list: shuffle(G.set.sentences).slice(0, 10), i: 0, score: 0, correct: 0 };
  G.t0 = Date.now();
  scNew();
}
function scNew() {
  const st = G.st, s = st.list[st.i];
  const words = s.text.split(' ');
  let pool = words.map(t => ({ t })), n = 0;
  do { pool = shuffle(pool); n++; } while (n < 15 && words.length > 1 && pool.map(x => x.t).join(' ') === s.text);
  Object.assign(st, { pool, picked: [], tries: 0, locked: false, fb: '' });
  scRender();
}
function scRender() {
  const st = G.st, s = st.list[st.i];
  app.innerHTML = `<div class="page" style="max-width:820px">
    ${gameHead(`<span class="gstat">Câu ${st.i + 1}/${st.list.length}</span><span class="gstat">⭐ ${st.score} điểm</span>`)}
    <div class="card">
      ${s.meaning ? `<div class="muted" style="margin-bottom:12px">💡 Nghĩa: <i>${esc(s.meaning)}</i></div>` : ''}
      <div class="sc-area">${st.picked.length ? st.picked.map((x, j) => `<button class="tok in" data-act="scRemove" data-j="${j}" ${st.locked ? 'disabled' : ''}>${esc(x.t)}</button>`).join('')
        : '<span class="muted">Chạm vào các từ bên dưới theo đúng thứ tự…</span>'}</div>
      <div class="sc-pool">${st.pool.map((x, j) => `<button class="tok" data-act="scPick" data-j="${j}" ${st.locked ? 'disabled' : ''}>${esc(x.t)}</button>`).join('')}</div>
      ${st.fb}
      <div class="m-actions">${st.locked ? '<button class="btn primary" data-act="scNext">Câu tiếp →</button>'
        : `<button class="btn" data-act="scSkip">Bỏ qua</button><button class="btn primary" data-act="scCheck" ${st.pool.length ? 'disabled' : ''}>Kiểm tra</button>`}</div>
    </div></div>`;
}
function scPick(j) { const st = G.st; st.picked.push(st.pool.splice(j, 1)[0]); st.fb = ''; scRender(); }
function scRemove(j) { const st = G.st; st.pool.push(st.picked.splice(j, 1)[0]); st.fb = ''; scRender(); }
function scCheck() {
  const st = G.st, s = st.list[st.i];
  if (st.picked.map(x => x.t).join(' ') === s.text) {
    const pts = st.tries === 0 ? 100 : 50;
    st.score += pts; st.correct++; st.locked = true;
    st.fb = `<div class="fb ok">✅ Chính xác! +${pts} điểm</div>`;
    speak(s.text);
  } else {
    st.tries++;
    if (st.tries >= 2) { st.locked = true; st.fb = `<div class="fb bad">❌ Chưa đúng. Đáp án: <b>${esc(s.text)}</b></div>`; }
    else st.fb = '<div class="fb bad">❌ Chưa đúng, thử lại một lần nữa nhé! (Chạm vào từ ở trên để gỡ ra)</div>';
  }
  scRender();
}
function scSkip() { const st = G.st; st.locked = true; st.fb = `<div class="fb bad">Đáp án: <b>${esc(st.list[st.i].text)}</b></div>`; scRender(); }
function scNext() {
  const st = G.st; st.i++;
  if (st.i >= st.list.length) gameEnd({ score: st.score, correct: st.correct, total: st.list.length, seconds: elapsed(),
    note: '<p class="muted small" style="margin:4px 0 0">Đúng ngay lần đầu: 100 điểm · lần thứ hai: 50 điểm</p>' });
  else scNew();
}

/* ---------- 4. Đua tốc độ ---------- */
function spStart() {
  const words = G.set.words;
  const qs = shuffle(words).slice(0, Math.min(10, words.length)).map(w => {
    const dir = Math.random() < 0.5 ? 'wm' : 'mw';          // wm: hỏi từ → chọn nghĩa; mw: hỏi nghĩa → chọn từ
    const key = dir === 'wm' ? 'meaning' : 'word';
    const others = shuffle(words.filter(x => x[key] !== w[key]).map(x => x[key])).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3);
    return { q: dir === 'wm' ? w.word : w.meaning, dir, right: w[key], opts: shuffle([w[key]].concat(others)) };
  });
  G.st = { qs, i: 0, score: 0, correct: 0 };
  G.t0 = Date.now();
  spNext();
}
function spNext() {
  const st = G.st;
  Object.assign(st, { left: SP_TIME, answered: false, qStart: Date.now() });
  spRender();
  clearInterval(G.tick);
  G.tick = setInterval(() => {

    const t = $('#tleft'); if (t) t.textContent = '⏳ ' + Math.ceil(st.left) + 's';
    if (st.left <= 0) spAnswer(null);
  }, 100);
}
function spRender() {

    ${gameHead(`<span class="gstat">Câu ${st.i + 1}/${st.qs.length}</span><span class="gstat">⭐ ${st.score}</span><span class="gstat" id="tleft">⏳ ${SP_TIME}s</span>`)}

    <div class="card" style="margin-top:16px">

    </div></div>`;
}
function spAnswer(k) {
  const st = G.st;
  if (st.answered) return;
  st.answered = true;

}

/* ---------- 6. Spelling – xếp chữ cái cho sẵn thành từ ---------- */
function slStart() {
  const qs = shuffle(G.set.words).slice(0, Math.min(10, G.set.words.length)).map(w => {
    const chars = [...String(w.word).toLowerCase()];
    const pos = chars.map((c, i) => (/[a-z]/.test(c) ? i : -1)).filter(i => i >= 0);   // vị trí cần điền (chỉ chữ cái)
    let tiles = shuffle(pos.map(i => chars[i]));
    for (let t = 0; t < 5 && pos.length > 2 && tiles.join('') === pos.map(i => chars[i]).join(''); t++) tiles = shuffle(tiles);
    return { w, chars, pos, tiles };
  });
  qs.forEach(q => preload(q.w.image));
  G.st = { qs, i: 0, score: 0, correct: 0 };
  G.t0 = Date.now();
  slNext();
}
function slNext() {
  const st = G.st, q = st.qs[st.i];
  Object.assign(st, { fill: q.pos.map(() => null), used: q.tiles.map(() => false), hints: 0, wrong: 0, done: false, hinted: {} });
  slRender();
  setTimeout(() => speak(q.w.word), 300);
}
function slRender() {
  const st = G.st, q = st.qs[st.i];
  let k = -1;
  const slots = q.chars.map((c, i) => {
    if (!/[a-z]/.test(c)) return `<span class="sl-sep">${c === ' ' ? '' : esc(c)}</span>`;
    k++; const j = st.fill[k];
    return `<button class="sl-slot ${st.hinted[k] ? 'hint' : ''}" data-act="slRemove" data-k="${k}">${j == null ? '' : esc(q.tiles[j])}</button>`;
  }).join('');
  app.innerHTML = `<div class="page" style="max-width:780px">
    ${gameHead(`<span class="gstat">Từ ${st.i + 1}/${st.qs.length}</span><span class="gstat">⭐ ${st.score}</span>`)}
    <div class="card" style="margin-top:16px">
      ${q.w.image ? imgTag(q.w.image, 'pc-pic sl-pic') : ''}
      <div class="sl-mean">${esc(q.w.meaning)}</div>
      <div style="text-align:center"><button class="speak" style="background:#f3f0fa;color:var(--violet-d)" data-act="speak" data-text="${esc(q.w.word)}">🔊 Nghe từ</button>
        <span class="muted small" style="margin-left:8px">${q.pos.length} chữ cái</span></div>
      <div class="sl-slots" id="slSlots">${slots}</div>
      <div class="sl-tiles">${q.tiles.map((c, j) => `<button class="sl-tile ${st.used[j] ? 'used' : ''}" data-act="slPick" data-j="${j}">${esc(c)}</button>`).join('')}</div>
      <div class="pc-fb" id="slFb"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" data-act="slHint">💡 Gợi ý (−25 điểm)</button>
        <button class="btn" data-act="slSkip">⏭️ Bỏ qua</button></div>
      <p class="muted small" style="text-align:center;margin:12px 0 0">Bấm chữ cái theo đúng thứ tự (hoặc gõ bàn phím). Bấm vào ô đã điền để gỡ chữ ra.</p>
    </div></div>`;
}
function slPick(j) {
  const st = G.st; if (!st || st.done || st.used[j]) return;
  const k = st.fill.indexOf(null); if (k < 0) return;
  st.fill[k] = j; st.used[j] = true;
  slRender(); slCheck();
}
function slRemove(k) {
  const st = G.st; if (!st || st.done || st.fill[k] == null || st.hinted[k]) return;
  st.used[st.fill[k]] = false; st.fill[k] = null; slRender();
}
function slHint() {
  const st = G.st, q = st.qs[st.i]; if (st.done) return;
  // ô đầu tiên chưa đúng → đặt chữ đúng vào (gỡ chữ sai nếu có)
  const k = q.pos.findIndex((p, n) => st.fill[n] == null || q.tiles[st.fill[n]] !== q.chars[p]);
  if (k < 0) return;
  if (st.fill[k] != null) { st.used[st.fill[k]] = false; st.fill[k] = null; }
  const need = q.chars[q.pos[k]];
  let j = q.tiles.findIndex((c, x) => c === need && !st.used[x]);
  if (j < 0) { const n = st.fill.findIndex((x, n2) => x != null && !st.hinted[n2] && q.tiles[x] === need); j = st.fill[n]; st.fill[n] = null; }
  st.fill[k] = j; st.used[j] = true; st.hinted[k] = true; st.hints++;
  slRender(); slCheck();
}
function slCheck() {
  const st = G.st, q = st.qs[st.i];
  if (st.fill.indexOf(null) >= 0) return;
  const ok = q.pos.every((p, n) => q.tiles[st.fill[n]] === q.chars[p]);
  const slots = document.querySelectorAll('.sl-slot');
  if (ok) {
    st.done = true; st.correct++;
    const pts = Math.max(20, 100 - 25 * st.hints - 15 * st.wrong); st.score += pts;
    slots.forEach(b => b.classList.add('ok'));
    const fb = $('#slFb'); if (fb) fb.textContent = '✅ ' + q.w.word + '  (+' + pts + ' điểm)';
    speak(q.w.word);
    G.tmo = setTimeout(slAdvance, 1400);
  } else {
    st.wrong++;
    slots.forEach((b, n) => { if (q.tiles[st.fill[n]] !== q.chars[q.pos[n]]) b.classList.add('bad'); });
    const box = $('#slSlots'); if (box) box.classList.add('sl-shake');
    const fb = $('#slFb'); if (fb) fb.textContent = '❌ Chưa đúng — bấm vào ô đỏ để gỡ chữ và thử lại';
  }
}
function slSkip() {
  const st = G.st, q = st.qs[st.i]; if (st.done) return;
  st.done = true;
  const fb = $('#slFb'); if (fb) fb.innerHTML = '⏭️ Đáp án: <b>' + esc(q.w.word) + '</b>';
  speak(q.w.word);
  G.tmo = setTimeout(slAdvance, 2200);
}
function slAdvance() {
  const st = G.st; st.i++;
  if (st.i >= st.qs.length) gameEnd({ score: st.score, correct: st.correct, total: st.qs.length, seconds: elapsed(),
    note: '<p class="muted small" style="margin:4px 0 0">Mỗi từ đúng: 100 điểm, trừ 25 điểm mỗi lần gợi ý và 15 điểm mỗi lần xếp sai (tối thiểu 20)</p>' });
  else slNext();
}
document.addEventListener('keydown', e => {
  if (!G.st || G.game !== 'spelling' || G.st.done == null || !$('#slSlots') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName)) return;
  const st = G.st, q = st.qs[st.i];
  if (e.key === 'Backspace') {
    e.preventDefault();
    for (let k = st.fill.length - 1; k >= 0; k--) if (st.fill[k] != null && !st.hinted[k]) return slRemove(k);
  } else if (/^[a-zA-Z]$/.test(e.key)) {
    const j = q.tiles.findIndex((c, x) => c === e.key.toLowerCase() && !st.used[x]);
    if (j >= 0) slPick(j);
  }
});

/* ---------- Soạn bộ từ ---------- */
function parseWords(text) {
  const ok = [], bad = [];
  String(text || '').split('\n').forEach((l, i) => {
    l = l.trim(); if (!l) return;
    const p = l.split(/\s*\|\s*|\t/).map(x => x.trim());
    if (p[0] && p[1]) ok.push(wordFrom(p)); else bad.push(i + 1);
  });
  return { ok, bad };
}
function parseSentences(text) {
  const ok = [], bad = [];
  String(text || '').split('\n').forEach((l, i) => {
    l = l.trim(); if (!l) return;
    const p = l.split(/\s*\|\s*|\t/);
    const t = (p[0] || '').trim().replace(/\s+/g, ' ');
    if (t.split(' ').length >= 2) ok.push({ text: t, meaning: (p[1] || '').trim() }); else bad.push(i + 1);
  });
  return { ok, bad };
}
function parseInfo(r, unit) { return `<b>${r.ok.length}</b> ${unit} hợp lệ${r.bad.length ? ` · <span style="color:var(--bad)">⚠️ Dòng lỗi: ${r.bad.join(', ')}</span>` : ''}`; }

function dueTag(iso, done) {
  if (!iso) return '<span class="tag">Không hạn</span>';
  const ms = new Date(iso).getTime() - Date.now();
  if (done) return `<span class="tag">Hạn ${fmtDate(iso)}</span>`;
  if (ms < 0) return `<span class="tag bad">Quá hạn · ${fmtDate(iso)}</span>`;
  const days = Math.floor(ms / 864e5), hours = Math.floor(ms / 36e5);
  const left = days >= 1 ? `còn ${days} ngày` : `còn ${Math.max(hours, 0)} giờ`;
  return `<span class="tag ${days < 1 ? 'warn' : ''}">Hạn ${fmtDate(iso)} · ${left}</span>`;
}
function asgIcon(a) { return a.kind === 'exam' ? '🗂️' : a.kind === 'exercise' ? '📝' : (a.game && GAMES[a.game] ? GAMES[a.game].icon : '🎮'); }

/* =====================================================================
   NHẬP NHIỀU BỘ TỪ CÙNG LÚC
   ===================================================================== */
function parseMulti(text, defLevel, defSub) {
  const sets = []; let cur = null, mode = null;
  String(text || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.trim(); let m;
    if ((m = l.match(/^#{2,3}\s+(.+)$/))) { cur = { title: m[1].replace(/\*/g, '').trim(), level: defLevel, subLevel: defSub, words: [], sentences: [], bad: [] }; sets.push(cur); mode = null; return; }
    if (!cur || !l || l.startsWith('```') || /^-{3,}$/.test(l)) return;
    if (!l.includes('|')) {
      if ((m = l.match(/^\**\s*(cấp độ|level)\s*:\s*\**\s*(.+?)\s*\**$/i))) {
        const v = m[2].trim().toLowerCase(), lv = LEVELS.find(x => x.id.toLowerCase() === v || x.name.toLowerCase() === v);
        if (lv) cur.level = lv.id; else cur.bad.push('Cấp độ không rõ: ' + m[2]);
        return;
      }
      if ((m = l.match(/^\**\s*(lớp|cấp nhỏ)\s*:\s*\**\s*(.+?)\s*\**$/i))) { cur.subLevel = m[2].trim(); return; }
      if (/^\**\s*(từ vựng|vocabulary|words?)\b/i.test(l)) { mode = 'w'; return; }
      if (/^\**\s*(câu|sentences?)(\s|\*|:|$)/i.test(l)) { mode = 's'; return; }
    }
    if (mode === 'w') {
      const p = l.split(/\s*\|\s*|\t/).map(x => x.trim());
      if (p[0] && p[1]) cur.words.push(wordFrom(p)); else cur.bad.push('Dòng từ vựng lỗi: ' + l);
    } else if (mode === 's') {
      const p = l.split(/\s*\|\s*|\t/), t = (p[0] || '').trim().replace(/\s+/g, ' ');
      if (t.split(' ').length >= 2) cur.sentences.push({ text: t, meaning: (p[1] || '').trim() }); else cur.bad.push('Câu lỗi: ' + l);
    }
  });
  sets.forEach(s => {
    const lv = LEVELS.find(x => x.id === s.level);
    if (!lv || lv.subs.indexOf(s.subLevel) < 0) s.bad.push(`Lớp/cấp nhỏ “${s.subLevel || '?'}” không thuộc ${lv ? lv.name : 'cấp độ'}`);
    if (!s.words.length && !s.sentences.length) s.bad.push('Không có từ vựng hay câu nào');
  });
  return sets;
}

var EXAM = <?!= examJson ?>;

const LET5 = ['A', 'B', 'C', 'D', 'E'];
function typeName(t) { return EXAM.types[t] || t; }
function fmtScore(s) { return (Math.round(s * 100) / 100).toLocaleString('vi-VN'); }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec / 60), s = sec % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function stopExamTimers() { clearInterval(X.timer); X.timer = null; ttsStop(); }

/** Định dạng chữ trong đề: **đậm**  ~~gạch chân~~  ##đậm+gạch chân##  //nghiêng// */
function fmt(t) {
  return esc(t)
    .replace(/##(.+?)##/g, '<b><u>$1</u></b>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/~~(.+?)~~/g, '<u>$1</u>')
    .replace(/(^|[^:])\/\/(.+?)\/\//g, '$1<i>$2</i>');
}
function passageHTML(t) {
  return String(t || '').split('\n').map(l => {
    if (!l.trim()) return '<div style="height:8px"></div>';
    if (l.startsWith('= ')) return `<div style="text-align:center">${fmt(l.slice(2))}</div>`;
    if (l.startsWith('- ')) return `<div style="padding-left:18px;text-indent:-12px">• ${fmt(l.slice(2))}</div>`;
    return `<p style="margin:0 0 6px;text-indent:24px">${fmt(l)}</p>`;
  }).join('');
}

/* ---------- Máy đọc phần nghe ---------- */
function pickVoices() {
  const all = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^en(-|_|$)/i.test(v.lang));
  const pref = v => (/GB|UK/i.test(v.lang + v.name) ? 0 : 1);
  all.sort((a, b) => pref(a) - pref(b));
  const fem = all.find(v => /female|samantha|zira|susan|karen|moira|tessa|serena|victoria|libby|sonia|hazel|aria|jenny/i.test(v.name));
  const male = all.find(v => /(^|\W)(male|daniel|david|alex|fred|george|ryan|guy|mark|thomas|arthur|oliver)(\W|$)/i.test(v.name) && !/female/i.test(v.name));
  return { list: all, fem: fem || all[0], male: male || all[1] || all[0] };
}
function ttsStop() {
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  if (X.tts && X.tts.si >= 0) { const b = $('#tts-' + X.tts.si); if (b) refreshTtsBtn(X.tts.si); }
  X.tts = { si: -1 };
}
function refreshTtsBtn(si) {
  const b = $('#tts-' + si); if (!b) return;
  const plays = X.st.plays[si] || 0, lock = plays >= 2 && !X.e.preview;
  b.disabled = lock; b.className = 'btn ' + (lock ? '' : 'primary');
  b.textContent = lock ? '🔇 Đã nghe đủ 2 lần' : `🎧 Nghe bài (còn ${Math.max(0, 2 - plays)} lượt)`;
  const i = $('#ttsInfo-' + si); if (i) i.textContent = '';
}
function ttsPlay(si) {
  if (!window.speechSynthesis) return toast('Trình duyệt này không hỗ trợ đọc. Hãy dùng Chrome hoặc Safari.', 'err');
  if (X.tts.si === si) return ttsStop();          // đang phát → bấm để dừng (vẫn tính 1 lượt)
  ttsStop();
  const sec = X.e.sections[si];
  const plays = X.st.plays[si] || 0;
  if (plays >= 2 && !X.e.preview) return;
  X.st.plays[si] = plays + 1; saveExamDraft();
  const V = pickVoices();
  const order = []; sec.script.forEach(([w]) => { if (order.indexOf(w) < 0) order.push(w); });
  const voiceOf = w => (order.indexOf(w) % 2 === 0 ? V.fem : V.male);
  const pitchOf = w => (order.indexOf(w) % 2 === 0 ? 1.1 : 0.9);
  X.tts = { si };
  const b = $('#tts-' + si); if (b) { b.textContent = '⏹ Đang phát… (bấm để dừng)'; b.className = 'btn'; }
  const info = $('#ttsInfo-' + si);
  sec.script.forEach(([w, text], i) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = 0.88; u.pitch = pitchOf(w);
    const v = voiceOf(w); if (v) { u.voice = v; u.lang = v.lang; }
    u.onstart = () => { if (info) info.textContent = w ? `🗣 ${w}` : ''; };
    if (i === sec.script.length - 1) u.onend = () => { if (X.tts.si === si) { X.tts = { si: -1 }; refreshTtsBtn(si); } };
    speechSynthesis.speak(u);
  });
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

      <p class="muted small" style="margin:4px 0 0">${esc(r.title)} · ${fmtDate(r.submittedAt)}</p></div></div>

        <td style="width:40%"><div class="bar"><i style="width:${pc}%;${pc < 50 ? 'background:#ef4444' : ''}"></i></div></td><td class="muted small" style="width:50px">${pc}%</td></tr>`; }).join('')}

function examReviewHTML(r) {

      ${leftHTML ? `<div class="split"><div class="split-left">${leftHTML}</div><div class="split-right">${readBtn('r' + si, s.passage ? 'Xem bài đọc' : 'Xem lời bài nghe')}${itemsHTML}</div></div>` : itemsHTML}</section>`;
    return h;
